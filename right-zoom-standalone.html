<!-- ═══════════════════════════════════════════════════════════════════════════
     SECTION 3 · RIGHT — Global Connectivity, ZOOMABLE version · STANDALONE COPY
     Everything is inside this one file: engine, map, logo and the data as of 6 Oct 2026.
     Open it anywhere (it fits a laptop or phone screen by itself; 1:1 on the wall).
     Placed in the goc-wall folder, it reads the live data/ files instead of its own copy.
     5280 × 1800. Dashboard x 0–4000, center3 logo wing x 4000–5280.
     Same data as right.html (cables.js · faults.js · capacity.js · chokepoints.js
     · pops.js · site.js). Nothing to edit in this file. Works offline (no CDN).

     What is different from right.html:
       • Zoom in and out, and drag the map around. Every view is redrawn sharp.
       • Selecting a cable (or a fault, a chokepoint, a landing station) leaves
         ONLY what belongs to it on the map — other cables, name tags, stations,
         faults and magnifiers are removed, not dimmed — and the side panels
         show only its faults, chokepoints, capacity and status.
       • The tour flies the camera to each fault, chokepoint and cable.

     How it draws (light on the wall PC):
       two map canvases — the next view is drawn into the hidden one, then the
       two cross-fade while the camera glides (transform + opacity only, so the
       motion runs on the graphics card). Nothing is redrawn while it rests.

     Mouse / touch:  wheel or pinch = zoom at that point · drag = move the map
                     double-click = zoom in (Shift + double-click = out)
                     click a cable, name tag, fault, magnifier or station = select it
                     click empty sea = show everything again (the view stays)
                     a chokepoint (row or magnifier) = its card opens: every system UP / DEGRADED / DOWN
                     name tags show only once something is selected (the whole network stays uncluttered)
                     + / − / ⌂ buttons appear when the mouse moves
     Keys:  + −  zoom · Shift + arrows move · ← → cables · F faults · C chokepoints
            Esc / 0 / H whole network · T tour on/off
     Tablet: window.__setView(n) — 0 whole network, n = n-th cable
             'cable:smw4' · 'fault:INC-2603' · 'choke:egypt' · 'station:Jeddah' · 'all'
             'zoom:in' · 'zoom:out' · 'zoom:home' · 'zoom:3' · 'goto:39.2,21.5,4'
             'pan:left|right|up|down' · 'tour:on' · 'tour:off'
     ═══════════════════════════════════════════════════════════════════════════ -->

<style>/* core/goc-theme.css */
/* ═══════════════════════════════════════════════════════════════════════════
   GOC THEME — one design language for all three wall sections (center3 palette)
   Performance rules: no backdrop-filter, animate only opacity / transform.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ink:#0a0313; --purple:#4f008c; --moon:#a54ee1; --coral:#ff375e; --sea:#1bced8;
  --sun:#ffdd40; --sunset:#ff6a39; --oasis:#00c48c;
  --text:#f2ecf7; --dim:#d3cae6; --dimmer:#ab9fca;
  --card:rgba(10,3,19,.62); --cardLine:rgba(165,78,225,.28); --cardSoft:rgba(79,0,140,.16);
  --shadow:0 6px 16px rgba(0,0,0,.40);
  --sev-critical:#ff375e; --sev-major:#ff7a3d; --sev-minor:#ffce3a; --sev-ok:#00c48c;
  --display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono','Consolas',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:5280px;height:1800px;overflow:hidden;background:var(--ink);}
body{color:var(--text);font-family:var(--body);cursor:none;user-select:none;-webkit-font-smoothing:antialiased;}
body.goc-pointer{cursor:default;}

/* ── ONE CONTINUOUS WALL BACKDROP ───────────────────────────────────────────
   The backdrop is drawn in WALL coordinates (15840 × 1800) and each section
   shows its own slice of it: --wx is the section's x on the wall
   (left 0 · middle 5280 · right 10560). Glows, grid and the two platform rails
   therefore run straight across the seams between the three PCs/windows.
   Only the two outer ends of the wall are darkened. Static: painted once. */
.goc-stage{position:relative;width:5280px;height:1800px;overflow:hidden;background:#0d0318;}
.goc-stage::before{content:"";position:absolute;top:0;left:calc(var(--wx, 0px) * -1);width:15840px;height:1800px;pointer-events:none;
  background:
    /* platform rails, top and bottom, edge to edge */
    linear-gradient(90deg, rgba(165,78,225,0) 0, rgba(165,78,225,.55) 5%, rgba(27,206,216,.55) 33%, rgba(165,78,225,.55) 50%, rgba(27,206,216,.55) 67%, rgba(165,78,225,.55) 95%, rgba(165,78,225,0) 100%) 0 1782px / 15840px 2px no-repeat,
    linear-gradient(90deg, rgba(165,78,225,0) 0, rgba(165,78,225,.35) 5%, rgba(165,78,225,.35) 95%, rgba(165,78,225,0) 100%) 0 16px / 15840px 1px no-repeat,
    /* scan grid, 88 px — 5280 is an exact multiple, so lines continue across seams */
    linear-gradient(rgba(165,78,225,.055) 1px, transparent 1px) 0 0 / 88px 88px,
    linear-gradient(90deg, rgba(165,78,225,.055) 1px, transparent 1px) 0 0 / 88px 88px,
    /* top & bottom shading, identical everywhere along the wall */
    linear-gradient(180deg, rgba(6,1,12,.62) 0, rgba(6,1,12,0) 24%, rgba(6,1,12,0) 74%, rgba(6,1,12,.7) 100%) 0 0 / 15840px 1800px no-repeat,
    /* darken only the two outer ends of the wall */
    linear-gradient(90deg, rgba(6,1,12,.8) 0, rgba(6,1,12,0) 1100px, rgba(6,1,12,0) 14740px, rgba(6,1,12,.8) 15840px) 0 0 / 15840px 1800px no-repeat,
    /* one long band of light running the whole wall, with soft swells */
    radial-gradient(4600px 1500px at 2640px 64%, rgba(74,20,134,.55), transparent 72%) 0 0 / 15840px 1800px no-repeat,
    radial-gradient(4600px 1500px at 7920px 64%, rgba(74,20,134,.55), transparent 72%) 0 0 / 15840px 1800px no-repeat,
    radial-gradient(4600px 1500px at 13200px 64%, rgba(74,20,134,.55), transparent 72%) 0 0 / 15840px 1800px no-repeat,
    radial-gradient(3000px 1300px at 5280px 60%, rgba(74,20,134,.38), transparent 72%) 0 0 / 15840px 1800px no-repeat,
    radial-gradient(3000px 1300px at 10560px 60%, rgba(74,20,134,.38), transparent 72%) 0 0 / 15840px 1800px no-repeat,
    linear-gradient(180deg, #1c0836 0%, #170530 50%, #0f0320 100%) 0 0 / 15840px 1800px no-repeat;}

/* section headers sit on the same line on every section */
.goc-head{position:absolute;top:58px;text-align:center;z-index:6;}
.goc-head .goc-kicker{font-size:22px;letter-spacing:.42em;margin-bottom:16px;}

/* the center3 logo, only at the two outer ends of the wall */
.goc-wing{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center;}
.goc-wing img{height:118px;display:block;}

/* type */
.goc-kicker{font-family:var(--mono);font-size:24px;letter-spacing:.5em;text-transform:uppercase;color:var(--coral);}
.goc-h1{font-family:var(--display);font-weight:600;color:#fff;letter-spacing:.005em;line-height:1.02;
  text-shadow:0 0 60px rgba(165,78,225,.45);}
.goc-sub{font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--moon);}
.lab{font-family:var(--mono);font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);}

/* cards */
.card{border:1px solid var(--cardLine);border-radius:22px;background:var(--card);box-shadow:var(--shadow);}
.card.soft{background:var(--cardSoft);box-shadow:none;}
.pill{display:inline-flex;align-items:baseline;gap:10px;padding:10px 26px;border-radius:999px;
  border:1px solid var(--cardLine);background:var(--card);font-family:var(--mono);font-size:20px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);white-space:nowrap;}
.pill b{font-family:var(--display);font-weight:600;font-size:30px;color:#fff;letter-spacing:0;}
.pill i{font-style:normal;color:var(--sea);}

/* corner tick marks on a card — a light "instrument" detail */
.ticks{position:relative;}
.ticks::before,.ticks::after{content:"";position:absolute;width:22px;height:22px;border:2px solid rgba(27,206,216,.55);pointer-events:none;}
.ticks::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:22px;}
.ticks::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:22px;}

/* status */
.sev{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:18px;letter-spacing:.12em;
  text-transform:uppercase;padding:6px 14px;border-radius:999px;white-space:nowrap;}
.sev::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;}
.sev.critical{color:#ff6b85;background:rgba(255,55,94,.14);border:1px solid rgba(255,55,94,.5);}
.sev.major{color:#ff9d6e;background:rgba(255,122,61,.14);border:1px solid rgba(255,122,61,.5);}
.sev.minor{color:#ffd966;background:rgba(255,206,58,.12);border:1px solid rgba(255,206,58,.45);}
.sev.ok,.sev.resolved{color:#4fd8ac;background:rgba(0,196,140,.12);border:1px solid rgba(0,196,140,.45);}
.sev.planned{color:var(--dimmer);background:rgba(171,159,202,.1);border:1px dashed rgba(171,159,202,.5);}
.sev.live::before{animation:goc-blink 2.2s ease-in-out infinite;}

/* the amber tag on any block whose data is marked sample:true */
.goc-sample{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:16px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:#ffce3a;padding:5px 12px;border-radius:8px;
  border:1px dashed rgba(255,206,58,.6);background:rgba(255,206,58,.08);vertical-align:middle;white-space:nowrap;}
.goc-sample::before{content:"";width:8px;height:8px;border-radius:50%;background:#ffce3a;}

/* motion (opacity / transform only) */
@keyframes goc-rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
@keyframes goc-fade{from{opacity:0}to{opacity:1}}
@keyframes goc-blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes goc-ping{0%{transform:translate(-50%,-50%) scale(.35);opacity:.9}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.rise{animation:goc-rise .8s cubic-bezier(.2,.8,.3,1) both;}
.fade{animation:goc-fade .8s ease both;}

</style>
<style>
  /* ── map layers ──
     two map buffers (A/B): the next view is drawn into the hidden one, then they cross-fade while
     the camera moves (transform + opacity only, so the move runs on the compositor) */
  .buf{position:absolute;left:560px;top:0;width:2980px;height:1800px;transform-origin:1450px 900px;opacity:0;will-change:transform,opacity;pointer-events:none;}
  .buf.front{opacity:1;}
  #over{position:absolute;left:0;top:0;width:0;height:0;z-index:4;transition:opacity .35s ease;}
  #over.hide{opacity:0;transition:opacity .16s ease;pointer-events:none;}
  #pulses{position:absolute;left:0;top:0;width:0;height:0;z-index:4;pointer-events:none;}
  #pulses i{position:absolute;left:0;top:0;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;opacity:0;will-change:transform,opacity;
            background:radial-gradient(circle,#fff 0,#fff 9%,rgba(var(--rgb),.9) 20%,rgba(var(--rgb),.28) 46%,rgba(var(--rgb),0) 70%);}
  #leaders{position:absolute;left:0;top:0;width:4400px;height:1800px;z-index:4;pointer-events:none;overflow:visible;}
  #chips,#faultsLayer,#lenses{position:absolute;left:0;top:0;width:0;height:0;}
  #chips{z-index:5;} #lenses{z-index:6;} #faultsLayer{z-index:7;}
  .gone{display:none!important;}

  /* zoom controls — appear when a mouse moves, stay out of the way on the wall */
  #zoomui{position:absolute;z-index:9;left:3020px;top:1470px;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transition:opacity .4s ease;}
  #zoomui:not(.show){pointer-events:none;}
  #zoomui.show,body.goc-pointer #zoomui{opacity:1;pointer-events:auto;}
  #zoomui button{width:62px;height:62px;border-radius:50%;border:1px solid var(--cardLine);background:rgba(12,4,24,.86);color:#fff;
                 font-family:var(--display);font-size:34px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);}
  #zoomui button:hover{border-color:var(--sea);}
  #zoomui button svg{width:28px;height:28px;}
  #zoomui span{font-family:var(--mono);font-size:16px;letter-spacing:.12em;color:var(--dimmer);}
  .stagepan{touch-action:none;-webkit-user-select:none;user-select:none;}
  /* the mouse pointer shows only while a mouse is moving (hidden on the wall otherwise) */
  body:not(.goc-pointer) .stagepan:not(.mouse),body:not(.goc-pointer) .stagepan:not(.mouse) *{cursor:none!important;}
  body.goc-pointer .stagepan,.stagepan.mouse{cursor:grab;}
  body.goc-pointer .stagepan.dragging,.stagepan.mouse.dragging{cursor:grabbing;}
  .stagepan .panel,.stagepan #spot{cursor:default;}

  /* cable name tags */
  .chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:10px;white-space:nowrap;padding:6px 14px 6px 11px;border-radius:10px;
        background:rgba(12,4,24,.84);border:1.5px solid var(--c);font-family:var(--display);font-weight:600;font-size:25px;
        line-height:1;color:#fff;letter-spacing:.01em;cursor:pointer;}
  .chip i{width:16px;height:4px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c);flex:0 0 auto;}
  .chip.planned{border-style:dashed;}
  .chip.planned i{background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 6px);box-shadow:none;}
  .chip em{font-style:normal;font-family:var(--mono);font-weight:500;font-size:16px;letter-spacing:.1em;color:var(--c);}

  /* KSA + stations labels are drawn on the canvas; fault markers are DOM */
  .fm{position:absolute;width:0;height:0;}
  .fm .core{position:absolute;left:0;top:0;width:34px;height:34px;transform:translate(-50%,-50%);display:grid;place-items:center;
            border-radius:50%;background:var(--c);box-shadow:0 0 0 4px #0a0313,0 0 26px var(--c);
            font-family:var(--display);font-weight:700;font-size:21px;line-height:1;color:#12051f;cursor:pointer;}
  .fm.minor .core{border-radius:7px;width:30px;height:30px;transform:translate(-50%,-50%) rotate(45deg);}
  .fm.minor .core b{transform:rotate(-45deg);}
  .fm .core b{font-weight:700;}
  .fm .ring{position:absolute;left:0;top:0;width:150px;height:150px;border-radius:50%;border:3px solid var(--c);opacity:0;
            transform:translate(-50%,-50%) scale(.3);pointer-events:none;}
  .fm.ping .ring{animation:goc-ping 2.4s cubic-bezier(.2,.6,.3,1) 0s infinite;}
  .fm.ping .ring.b{animation-delay:1.2s;}
  .fm .tag{position:absolute;white-space:nowrap;padding:7px 13px;border-radius:9px;background:rgba(12,4,24,.9);border:1.5px solid var(--c);
           font-family:var(--display);font-weight:600;font-size:22px;line-height:1;color:#fff;}
  .fm .tag small{font-family:var(--mono);font-weight:500;font-size:15px;letter-spacing:.12em;color:var(--c);margin-left:9px;text-transform:uppercase;}
  .fm .cnt{position:absolute;left:12px;top:-30px;font-family:var(--display);font-weight:700;font-size:17px;color:#fff;
           background:#0a0313;border:2px solid var(--c);border-radius:999px;padding:1px 8px;}

  /* chokepoint magnifiers */
  .lens{position:absolute;width:330px;cursor:pointer;}
  .lens .glass{position:relative;width:330px;height:330px;border-radius:50%;
               box-shadow:0 0 0 2px var(--lc),0 0 0 9px rgba(10,3,19,.75),0 0 0 10px rgba(214,190,255,.18),0 18px 40px rgba(0,0,0,.45);}
  .lens canvas{display:block;width:330px;height:330px;border-radius:50%;}
  .lens .ticks4{position:absolute;inset:-14px;border-radius:50%;pointer-events:none;
                background:conic-gradient(from -2deg,var(--lc) 0 4deg,transparent 4deg 86deg,var(--lc) 86deg 94deg,transparent 94deg 176deg,var(--lc) 176deg 184deg,transparent 184deg 266deg,var(--lc) 266deg 274deg,transparent 274deg 356deg,var(--lc) 356deg);
                -webkit-mask:radial-gradient(circle,transparent 177px,#000 178px,#000 181px,transparent 182px);mask:radial-gradient(circle,transparent 177px,#000 178px,#000 181px,transparent 182px);}
  .lens .cap{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;
             text-shadow:0 0 3px #0a0313,0 0 7px #0a0313,0 0 12px rgba(10,3,19,.9);}
  .lens .cap.below{top:354px;} .lens .cap.above{bottom:354px;}
  .lens .cap.right{left:358px;top:50%;transform:translateY(-50%);text-align:left;}
  .lens .cap.left{left:auto;right:358px;top:50%;transform:translateY(-50%);text-align:right;}
  .lens .cap b{display:block;font-family:var(--display);font-weight:600;font-size:29px;color:#fff;line-height:1.1;}
  .lens .cap span{display:inline-flex;align-items:center;gap:9px;margin-top:7px;font-family:var(--mono);font-size:18px;letter-spacing:.12em;
                  text-transform:uppercase;color:var(--lc);}
  .lens .cap span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--lc);}
  .lens .cap em{display:block;font-style:normal;font-family:var(--mono);font-size:14px;letter-spacing:.03em;color:var(--dim);margin-top:6px;}

  /* ── side panels ── */
  .panel{position:absolute;z-index:8;top:40px;bottom:40px;display:flex;flex-direction:column;gap:22px;}
  #left{left:40px;width:840px;}
  #right{left:3140px;width:830px;}
  .ptitle{padding-top:18px;}
  .ptitle .goc-kicker{font-size:22px;letter-spacing:.42em;margin-bottom:16px;}
  .ptitle h1{font-size:80px;}
  .ptitle .goc-sub{font-size:20px;margin-top:14px;}
  .sect{padding:22px 26px;}
  .sect>.lab{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}

  .stat{padding:14px 20px;border-radius:16px;background:var(--cardSoft);border:1px solid rgba(165,78,225,.22);min-width:0;}
  .stat .v{font-family:var(--display);font-weight:600;font-size:58px;line-height:1;color:#fff;white-space:nowrap;}
  .stat .v small{font-size:28px;color:var(--sea);font-weight:500;margin-left:6px;}
  .stat .l{font-family:var(--mono);font-size:18px;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer);margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .reach{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  #reachTag b{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:0;text-transform:none;}

  .cap .big{display:flex;align-items:baseline;gap:12px;}
  .cap .big b{font-family:var(--display);font-weight:600;font-size:78px;line-height:1;color:#fff;}
  .cap .big span{font-family:var(--display);font-size:32px;color:var(--sea);}
  .cap .split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:3px;margin:16px 0 10px;background:rgba(255,255,255,.05);}
  .cap .split i{display:block;height:100%;}
  .cap .wl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:19px;color:var(--dim);}

       background:rgba(10,3,19,.45);cursor:pointer;margin-bottom:12px;transition:background .4s,border-color .4s;}
  .flt.hide{display:none;}
  .flt.on{background:rgba(255,255,255,.07);border-color:var(--c);}
  .flt.resolved{opacity:.62;}
  .flt .fh{display:flex;align-items:center;gap:12px;}
  .flt .fh .sev{font-size:16px;padding:5px 11px;}
  .flt .fh b{font-family:var(--display);font-weight:600;font-size:32px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1;}
  .flt .fh em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:18px;color:var(--dim);white-space:nowrap;letter-spacing:.06em;}
  .flt .fd{font-size:23px;color:var(--text);margin-top:10px;line-height:1.25;}
  .flt .fl{font-family:var(--mono);font-size:17px;color:var(--dimmer);margin-top:6px;letter-spacing:.03em;}
  .flt .fx{display:flex;gap:26px;margin-top:10px;font-family:var(--mono);font-size:17px;color:var(--dimmer);letter-spacing:.08em;text-transform:uppercase;align-items:baseline;}
  .flt .fx b{color:#fff;font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:0;text-transform:none;margin-left:7px;}
  .flt .fx b.imp{color:#ff9d6e;}
  .flt .fu{font-size:19px;color:var(--dim);margin-top:7px;}
  .flt .lz{font-family:var(--mono);font-size:14px;letter-spacing:.1em;color:#ffc96b;border:1px solid rgba(255,176,58,.5);border-radius:6px;padding:2px 7px;}
  .fnote{display:flex;justify-content:space-between;font-family:var(--mono);font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);margin-top:4px;}
  .fnote #fPage{color:var(--dim);}
  .fempty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:100%;
          font-family:var(--mono);font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:#4fd8ac;}
  .fempty i{width:74px;height:74px;border-radius:50%;border:3px solid #00c48c;display:grid;place-items:center;font-style:normal;font-size:36px;}

  .cps{display:flex;flex-direction:column;gap:10px;}
  .cp{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;background:var(--cardSoft);border:1px solid rgba(165,78,225,.2);cursor:pointer;transition:background .4s,border-color .4s;}
  .cp b{font-family:var(--display);font-weight:600;font-size:27px;color:#fff;}
  .cp small{font-family:var(--mono);font-size:17px;color:var(--dimmer);margin-left:auto;margin-right:10px;white-space:nowrap;}
  .cp .sev{font-size:16px;padding:5px 11px;}
  .cp.on{background:rgba(255,255,255,.07);border-color:rgba(214,190,255,.6);}

  .legend{display:grid;grid-template-columns:1fr 1fr;gap:13px 18px;font-family:var(--mono);font-size:18px;color:var(--dim);letter-spacing:.04em;}
  .legend span{display:flex;align-items:center;gap:12px;white-space:nowrap;}
  .legend i{flex:0 0 auto;display:inline-block;}

  /* spotlight — what the map is showing right now */
  #spot{position:absolute;z-index:9;left:2010px;top:40px;transform:translate(-50%,-12px);opacity:0;overflow:hidden;
        transition:opacity .5s, transform .5s;display:flex;align-items:center;gap:28px;padding:18px 30px 20px;min-width:1080px;max-width:1420px;
        border-left:8px solid var(--c);}
  #spot.on{opacity:1;transform:translate(-50%,0);}
  #spot .n{font-family:var(--display);font-weight:700;font-size:56px;color:var(--c);line-height:1;white-space:nowrap;}
  #spot .mid{flex:1 1 auto;min-width:0;}
  #spot .f{font-family:var(--display);font-size:27px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #spot .m{font-family:var(--mono);font-size:19px;color:var(--dim);letter-spacing:.05em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #spot .m b{color:#fff;font-weight:500;}
  #spot .m .ksa{color:#ff8aa2;}
  #spot .m.x{margin-top:5px;color:var(--dimmer);}
  #spot .m.x:empty{display:none;}
  #spot .side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  #spot .step{font-family:var(--mono);font-size:16px;letter-spacing:.14em;color:var(--dimmer);}
  #spot .bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--c);transform-origin:0 50%;transform:scaleX(0);opacity:.85;}

  .fnone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;min-height:200px;text-align:center;
         font-family:var(--mono);font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#4fd8ac;}
  .fnone i{width:66px;height:66px;border-radius:50%;border:3px solid #00c48c;display:grid;place-items:center;font-style:normal;font-size:32px;}
  .cpnone{font-family:var(--mono);font-size:18px;letter-spacing:.06em;color:var(--dimmer);padding:6px 4px;}
  .nstat .top h2 b{color:var(--c);font-weight:600;}
  /* chokepoint card, opened (a chokepoint is selected): every system through it, UP / DEGRADED / DOWN */
  .cpsum{display:flex;gap:10px;}
  .cpsum .sev{font-size:16px;padding:5px 11px;}
  .cpx{display:flex;flex-direction:column;gap:8px;}
  .cpx-h,.cpx-r{display:grid;align-items:center;column-gap:16px;}
  .cpx.eg .cpx-h,.cpx.eg .cpx-r{grid-template-columns:1.25fr 1fr 1fr;}
  .cpx.sea .cpx-h,.cpx.sea .cpx-r{grid-template-columns:1.05fr .8fr 1.35fr;}
  .cpx-h{padding:4px 16px 0;font-family:var(--mono);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);}
  .cpx-r{padding:10px 16px;border-radius:14px;background:rgba(10,3,19,.42);border:1px solid rgba(165,78,225,.18);cursor:pointer;}
  .cpx-r.degraded{border-color:rgba(255,206,58,.45);} .cpx-r.down{border-color:rgba(255,55,94,.6);}
  .cpx-r.planned{opacity:.75;border-style:dashed;}
  .cpx-s{display:flex;align-items:center;gap:12px;min-width:0;}
  .cpx-s i{flex:0 0 auto;width:7px;height:40px;border-radius:4px;background:var(--c);box-shadow:0 0 10px var(--c);}
  .cpx-r.planned .cpx-s i{background:repeating-linear-gradient(180deg,var(--c) 0 5px,transparent 5px 10px);box-shadow:none;}
  .cpx-s>span{min-width:0;}
  .cpx-s b{display:block;font-family:var(--display);font-weight:600;font-size:26px;color:#fff;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cpx-s em{display:block;font-style:normal;font-family:var(--mono);font-size:15px;color:var(--dimmer);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cpx-c{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;}
  .cpx-c .sev{font-size:16px;padding:5px 11px;}
  .cpx-fp{font-family:var(--mono);font-size:14px;font-weight:500;padding:2px 7px;border-radius:6px;background:rgba(0,196,140,.14);color:#4fd8ac;}
  .cpx-fp.x{background:rgba(255,55,94,.18);color:#ff8fa3;}
  .cpx-fps{flex-basis:100%;display:flex;gap:6px;}
  .cpx-d{font-family:var(--mono);font-size:16px;line-height:1.35;color:var(--dim);min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .cpx-d.quiet{color:var(--dimmer);}
  .cpx-d small{font-size:15px;color:var(--dimmer);}
  .cpx-n{grid-column:1 / -1;margin-top:9px;padding-top:9px;border-top:1px solid rgba(165,78,225,.18);font-family:var(--mono);font-size:16px;line-height:1.35;color:var(--dim);}
  .cpx-n b{font-weight:500;}
  /* the roster tightens a little when there are more systems than fit */
  .roster.tight{gap:7px;}
  .roster.tight .cab{padding:6px 14px;}
  .roster.tight .cab .sw{height:42px;}
  .roster.tight .cab .nm{font-size:27px;}
  .roster.tight .cab .mt{font-size:16px;margin-top:3px;}
</style>
</head>

<script>/* data/site.js — copy as of 6 Oct 2026 */
/* ═══════════════════════════════════════════════════════════════════════════
   SITE SETTINGS — shared by all three wall sections
   ───────────────────────────────────────────────────────────────────────────
   Every file in this folder follows the same shape:
       (window.GOC_DATA = window.GOC_DATA || {}).<name> = { ... };
   Only edit what is between the outer { and }; keep commas between items and
   quotes around text. If a file ever has a typo, the wall keeps showing the
   last good version of it and check.html tells you which line to fix.
   ═══════════════════════════════════════════════════════════════════════════ */
(window.GOC_DATA = window.GOC_DATA || {}).site = {

  /* how often every page re-reads this data folder, in seconds.
     Edit a file on GitHub → the wall shows it within about this long
     (GitHub Pages itself can take a minute or two to publish a change). */
  refreshSeconds: 60,

  /* bottom line on the left section */
  footer: "24 / 7 / 365 Monitoring  ·  Riyadh, Kingdom of Saudi Arabia",

  /* any block marked  sample: true  shows a small amber "SAMPLE DATA" tag.
     Turn this off only once every number on the wall is confirmed. */
  showSampleTags: true,

  /* clock and dates on the wall */
  timeZone: "Asia/Riyadh",

  /* performance dials for the wall PC (lower = lighter) */
  fps: 30,            // animation frames per second
  renderScale: 0.6,   // animated layers are drawn at this fraction of full size

  /* how much moves on the cable map:
       "calm"   — when the tour moves on, a trace of light runs out along the cable
                  in the spotlight for a few seconds, then the map rests; a fault
                  ring pings while the fault is new or in the spotlight (default)
       "lively" — light keeps flowing along the cable in the spotlight, and along
                  every cable on the whole-network view (heavier)
       "still"  — nothing moves except the tour itself (lightest)            */
  mapMotion: "calm"
};

</script>

<script>/* data/faults.js — copy as of 6 Oct 2026 */
/* ═══════════════════════════════════════════════════════════════════════════
   FAULTS & EVENTS — drawn on the map and listed in "Network status"
   ───────────────────────────────────────────────────────────────────────────
   This is the file you will edit most. One { ... } per fault, comma between.
     id           any short reference (ticket number)
     cables       which systems are hit — names or ids from cables.js.
                  One cable = a single fault. Two or more = an EVENT (one marker,
                  "×N" badge, every listed cable highlighted together).
                  A name that is not in cables.js (e.g. "AAE-1") is treated as
                  leased capacity: listed, counted, but no route to draw.
     severity     "critical" | "major" | "minor"
     status       "open" | "resolved"
     lon, lat     where the marker goes (leave out for a leased system you can't place)
     location     text under the fault, e.g. "Red Sea · off Jeddah"
     description  what happened
     impactGbps   capacity lost, in Gbps (optional)
     date         when it started, "2026-10-03"
     etr          estimated time of repair, free text ("12 Oct", "TBC")
     update       latest status line
     cleared      date it was resolved — a resolved fault stays on the wall for
                  keepResolvedDays after this date, then drops off by itself
   Egypt land-crossing faults can also say which crossing was hit:
     chokepoint: "egypt", route: "primary" | "protection", fiberPair: "FP2"

<script>/* core/goc-core.js */
/* ═══════════════════════════════════════════════════════════════════════════
   GOC CORE — the engine every wall page runs on
   ───────────────────────────────────────────────────────────────────────────
   • Loads the data files (data/<name>.js) with plain <script> tags, so it works
     the same from GitHub Pages, from a web server, and double-clicked (file://).
   • Re-reads them every site.refreshSeconds and tells the page what changed —
     edit a file on GitHub and the wall updates itself, no reload needed.
   • A data file with a typo is ignored: the page keeps the last good version
     (a small amber dot appears in the corner; check.html shows the problem).
   • Shared helpers: formatting, dates, a frame-capped animation loop,
     tablet/scene sync, and ?fit preview scaling.

   URL options (add to any page address):
     ?data=https://<user>.github.io/<repo>/data/   read data from another place
     ?fit                                          scale the page to the window
     ?debug                                        show load status on screen
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {

  window.GOC_DATA = window.GOC_DATA || {};

  GOC.base = BASE;
  GOC.params = qs;

  var store = {};          // last good copy of every data file

    })();
  };

  function fit() {
    var auto = !!window.GOC_EMBEDDED && (innerWidth < 5200 || innerHeight < 1760);   // standalone copy: fits a smaller screen by itself (1:1 on the wall)
    var st = document.querySelector('.goc-stage'); if (!st) return;
    if (!qs.has('fit') && !auto) { st.style.transform = ''; document.documentElement.style.overflow = ''; return; }
    var k = Math.min(innerWidth / st.offsetWidth, innerHeight / st.offsetHeight);

  });
  GOC.fit = fit;
})();

<script>/* core/goc-geo.js */
/* ═══════════════════════════════════════════════════════════════════════════
   GOC GEO — map projections and canvas drawing shared by the map pages
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var GOC = window.GOC = window.GOC || {};
  var D2R = Math.PI / 180;

  /** decode assets/world.js → [{ id, rings:[[[lon,lat],...], ...] }] (cached) */
  var WORLD = null;
  GOC.world = function () {
    if (WORLD) return WORLD;
    var src = window.GOC_WORLD || [];
    WORLD = src.map(function (f) {
      return { id: f[0], rings: f[1].map(function (d) {
        var out = [], x = 0, y = 0;
        for (var i = 0; i < d.length; i += 2) { x += d[i]; y += d[i + 1]; out.push([x / 100, y / 100]); }
        return out;
      }) };
    });
    return WORLD;
  };

  function mercY(lat) {
    lat = Math.max(-85, Math.min(85, lat));
    return Math.log(Math.tan(Math.PI / 4 + lat * D2R / 2));
  }

  /** Mercator projection that fits a lon/lat box into a pixel box {x,y,w,h} */
  GOC.mercator = function (view, box) {
    var x0 = view.lon[0] * D2R, x1 = view.lon[1] * D2R;
    var y0 = mercY(view.lat[1]), y1 = mercY(view.lat[0]);
    var k = Math.min(box.w / (x1 - x0), box.h / (y0 - y1));
    var cx = box.x + box.w / 2, cy = box.y + box.h / 2;
    var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    var p = function (lon, lat) { return [cx + (lon * D2R - mx) * k, cy - (mercY(lat) - my) * k]; };
    p.k = k; p.pxPerDeg = k * D2R;
    p.invert = function (x, y) {
      var lon = ((x - cx) / k + mx) / D2R;
      var lat = (2 * Math.atan(Math.exp(-(y - cy) / k + my)) - Math.PI / 2) / D2R;
      return [lon, lat];
    };

  };

  GOC.equirect = function (pxPerDeg, lon0, lat0) {
    var p = function (lon, lat) { return [(lon - lon0) * pxPerDeg, (lat0 - lat) * pxPerDeg]; };
    p.pxPerDeg = pxPerDeg;
    return p;
  };

  /** trace one ring into the current canvas path (breaks at the antimeridian) */
  GOC.traceRing = function (ctx, ring, proj) {

      var q = proj(ring[i][0], ring[i][1]);
      if (i === 0 || (prev !== null && Math.abs(ring[i][0] - prev) > 180)) ctx.moveTo(q[0], q[1]);
      else ctx.lineTo(q[0], q[1]);

  };

  /** fill / stroke countries. style(id) → { fill, stroke, width } or null to skip */
  GOC.drawCountries = function (ctx, proj, style, clipBox) {

            var q = r[i];
            if (q[0] > clipBox[0] - 8 && q[0] < clipBox[1] + 8 && q[1] > clipBox[2] - 8 && q[1] < clipBox[3] + 8) { any = true; break; }
          }
          if (!any) return;
        }
        GOC.traceRing(ctx, r, proj);
      });
      if (st.fill) { ctx.fillStyle = st.fill; ctx.fill('evenodd'); }
      if (st.stroke) { ctx.strokeStyle = st.stroke; ctx.lineWidth = st.width || 1; ctx.stroke(); }
    });
  };

  /** polyline in pixels for a lon/lat path. Segments are straight on screen (rhumb lines on
      Mercator) — the same way the cable routes were planned, so they stay clear of land. */
  GOC.projectPath = function (path, proj) {
    var out = [];
    for (var i = 0; i < path.length; i++) out.push(proj(path[i][0], path[i][1]));
    return out;
  };

  /** cumulative lengths of a pixel polyline → for moving things along it */
  GOC.measure = function (pts) {
    var acc = [0], L = 0;
    for (var i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); acc.push(L); }
    return { pts: pts, acc: acc, len: L };
  };
  GOC.pointAt = function (m, d) {
    var acc = m.acc, pts = m.pts, lo = 0, hi = acc.length - 1;
    if (d <= 0) return pts[0];
    if (d >= m.len) return pts[pts.length - 1];
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (acc[mid] < d) lo = mid; else hi = mid; }
    var t = (d - acc[lo]) / ((acc[hi] - acc[lo]) || 1);
    return [pts[lo][0] + (pts[hi][0] - pts[lo][0]) * t, pts[lo][1] + (pts[hi][1] - pts[lo][1]) * t];
  };

  GOC.glowSprite = function (rgb, size) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var g = c.getContext('2d'), r = size / 2;
    var rg = g.createRadialGradient(r, r, 0, r, r, r);
    rg.addColorStop(0, 'rgba(255,255,255,.95)');
    rg.addColorStop(0.18, 'rgba(' + rgb + ',.85)');
    rg.addColorStop(0.45, 'rgba(' + rgb + ',.22)');
    rg.addColorStop(1, 'rgba(' + rgb + ',0)');

    var h = String(hex).replace('#', '');

    var n = parseInt(h, 16); return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  };
})();

<script>/* core/goc-network.js */
/* ═══════════════════════════════════════════════════════════════════════════
   GOC NETWORK MODEL — turns the raw data files into what the wall shows
   ───────────────────────────────────────────────────────────────────────────
   Reads cables.js + faults.js + capacity.js + chokepoints.js and works out:
   reach (countries, stations, km), each cable's live status, open / recently
   resolved faults, impacted capacity & availability, and chokepoint status.
   Nothing here is hand-maintained — change a data file, this recomputes.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var GOC = window.GOC = window.GOC || {};

  GOC.SEV_COLOR = { critical: '#ff375e', major: '#ff7a3d', minor: '#ffce3a', ok: '#00c48c', resolved: '#00c48c', planned: '#ab9fca' };
  GOC.SEV_LABEL = { critical: 'Critical', major: 'Major', minor: 'Minor', ok: 'Operational', resolved: 'Resolved', planned: 'Planned' };

  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ''); }
  function worst(list) {
    var w = 'ok';
    list.forEach(function (s) { if ((SEV[s] || 0) > (SEV[w] || 0)) w = s; });
    return w;
  }

  function inBox(lon, lat, b, m) {
    m = m || 0;

  }

  GOC.network = function (D) {

    var F = D.faults || { items: [] };
    var K = D.capacity || { owned: {}, leased: [] };
    var P = D.chokepoints || { items: [] };
    var countries = C.countries || {};

    /* ── systems + forgiving name lookup ── */
    var systems = (C.systems || []).map(function (s, i) {
      var cc = {}, st = {}, pcc = {}, home = [], homeP = [];
      (s.landings || []).forEach(function (l) {
        var live = !s.planned && !l.planned;
        if (live) { cc[l.cc] = 1; st[l.station + '|' + l.cc] = 1; } else pcc[l.cc] = 1;
        if (countries[l.cc] && countries[l.cc].home) { var hl = live || s.planned ? home : homeP; if (hl.indexOf(l.station) < 0) hl.push(l.station); }
      });
      Object.keys(cc).forEach(function (k) { delete pcc[k]; });
      return { idx: i, id: s.id, name: s.name, fullName: s.fullName || s.name, color: s.color || '#a54ee1',
               lengthKm: +s.lengthKm || 0, rfs: s.rfs, owners: s.owners || '', planned: !!s.planned,
               label: s.label, landings: s.landings || [], route: s.route || [],
               countries: Object.keys(cc), plannedCountries: Object.keys(pcc), stationKeys: Object.keys(st),
               allCountries: Object.keys(cc).concat(Object.keys(pcc)), homeStations: home, homePlanned: homeP,
               partlyPlanned: !s.planned && ((s.landings || []).some(function (l) { return l.planned; }) || (s.route || []).some(function (r) { return r.planned; })),
               faults: [], status: s.planned ? 'planned' : 'ok', raw: s };
    });
    var lookup = {};
    function alias(k, sys) { k = norm(k); if (k && !lookup[k]) lookup[k] = sys; }
    systems.forEach(function (s) {
      alias(s.id, s); alias(s.name, s); alias(s.fullName, s);
      String(s.name).replace(/\(([^)]*)\)/g, function (_, a) { alias(a, s); });
      alias(String(s.name).replace(/\([^)]*\)/g, ''), s);
    });
    function find(name) { return lookup[norm(name)] || null; }

    /* ── reach ── */
    var ccAll = {}, stAll = {}, km = 0;
    systems.forEach(function (s) {
      if (s.planned) return;
      s.countries.forEach(function (c) { ccAll[c] = 1; });
      s.stationKeys.forEach(function (k) { stAll[k] = 1; });
      km += s.lengthKm;
    });
    var live = systems.filter(function (s) { return !s.planned; });

    /* ── faults ── */
    var keepDays = F.keepResolvedDays != null ? +F.keepResolvedDays : 7;

      var names = f.cables || (f.cable ? [f.cable] : []);
      if (!Array.isArray(names)) names = [names];
      var mapped = [], leased = [];
      names.forEach(function (n) { var s = find(n); if (s) { if (mapped.indexOf(s) < 0) mapped.push(s); } else leased.push(String(n)); });
      var sev = String(f.severity || 'minor').toLowerCase();
      if (!SEV[sev]) sev = 'minor';
      var resolved = String(f.status || 'open').toLowerCase() === 'resolved';
      var lon = parseFloat(f.lon), lat = parseFloat(f.lat);
      return { n: i, id: f.id || ('F' + (i + 1)), names: names, mapped: mapped, leased: leased,
               event: names.length > 1, name: f.name || '',
               severity: sev, resolved: resolved, open: !resolved,
               lon: lon, lat: lat, placed: isFinite(lon) && isFinite(lat),
               location: f.location || '', description: f.description || '',
               impact: +f.impactGbps || 0, date: f.date || '', etr: f.etr || '', update: f.update || '',
               cleared: f.cleared || '', chokepoint: f.chokepoint || '', route: String(f.route || 'primary').toLowerCase(),

    var recent = items.filter(function (f) {

    open.sort(function (a, b) { return (SEV[b.severity] - SEV[a.severity]) || ((GOC.date(b.date) || 0) - (GOC.date(a.date) || 0)); });

      var v = owned[k] || [0, 0], s = find(k), key = s ? s.id : norm(k);
      if (s && s.planned) { plannedCap += (+v[0] || 0) + (+v[1] || 0); return; }   // counted once the system is in service
      perSys[key] = [(+v[0] || 0), (+v[1] || 0)];
      w += +v[0] || 0; e += +v[1] || 0;
    });
    ow = w + e;
    var leasedRows = (K.leased || []).map(function (r) { return { name: r.name, west: +r.west || 0, east: +r.east || 0 }; });
    if (view === 'global') leasedRows.forEach(function (r) {
      w += r.west; e += r.east; lw += r.west + r.east;
      var s = find(r.name), key = s ? s.id : norm(r.name);
      var p = perSys[key] || (perSys[key] = [0, 0]); p[0] += r.west; p[1] += r.east;
    });
    var total = w + e, impacted = 0;
    var impByKey = {};
    open.forEach(function (f) {
      if (!f.impact) return;
      if (view === 'owned' && !f.mapped.length) return;      // leased-only fault: not our owned capacity
      var key = f.mapped.length ? f.mapped.map(function (s) { return s.id; }).join('+') : norm(f.leased.join('+'));

    });
    Object.keys(impByKey).forEach(function (k) {
      var cap = 0;
      k.split('+').forEach(function (id) { var p = perSys[id]; if (p) cap += p[0] + p[1]; });
      impacted += cap ? Math.min(cap, impByKey[k]) : impByKey[k];

                     perSystem: perSys, sample: !!K.sample };

    /* ── chokepoint status words: UP · DEGRADED · DOWN ──
       What an open fault does to a cable (or to one Egypt crossing route) is decided here, once:
         1. the fault says it — service: "up" | "degraded" | "down" in faults.js, else
         2. fibre pairs (Egypt) — some of the known pairs hit = degraded, all of them = down, else
         3. severity — critical = down, major or minor = degraded.
       Several faults on the same cable or route: the worst one counts. */
    var SVC_RANK = { up: 0, degraded: 1, down: 2 };
    var SVC_WORDS = { up: 'up', ok: 'up', restored: 'up', degraded: 'degraded', degrade: 'degraded', partial: 'degraded',
                      impaired: 'degraded', down: 'down', cut: 'down', outage: 'down' };
    function svcSaid(f) { var r = f.raw || {}; return SVC_WORDS[String(r.service || r.state || '').toLowerCase().trim()] || ''; }
    function svcOf(f) { return svcSaid(f) || (f.severity === 'critical' ? 'down' : 'degraded'); }
    function svcWorst(list) { var w = 'up'; list.forEach(function (x) { if (SVC_RANK[x] > SVC_RANK[w]) w = x; }); return w; }
    GOC.svcOf = svcOf; GOC.svcWorst = svcWorst;

    /* ── chokepoints ── */
    var chokes = (P.items || []).map(function (c) {
      var b = c.bbox || [0, 0, 0, 0];
      var here = open.filter(function (f) {
        if (f.chokepoint) return norm(f.chokepoint) === norm(c.id);
        return f.placed && inBox(f.lon, f.lat, b, 0.3);
      });
      // a land crossing's routes are only marked down by faults that name the crossing
      var named = here.filter(function (f) { return f.chokepoint && norm(f.chokepoint) === norm(c.id); });
      var out = { id: c.id, name: c.name, kind: c.kind, blurb: c.blurb || '', bbox: b, inset: c.inset,
                  faults: here, cfg: c, rows: [] };
      if (c.kind === 'land' && c.crossings) {

          var sys = find(x.cable);
          var fs = named.filter(function (f) { return sys && f.mapped.indexOf(sys) >= 0; });
          /* one crossing route → svc 'up' | 'degraded' | 'down' (state keeps the older words for the map:
             'up' | 'partial' | 'down'), the fibre pairs hit, and the faults behind it */
          function routeState(route) {
            var rf = fs.filter(function (f) { return f.route === route; });
            var known = sys ? (fpk[sys.id] || null) : null;
            if (!rf.length) return { state: 'up', svc: 'up', down: [], known: known, faults: [] };
            var down = [], states = [], pairsHit = false;
            rf.forEach(function (f) {
              var fp = !known ? [] : String(f.fiberPair || '').split(/[,\s\/|]+/).filter(Boolean)
                .map(function (x) { return x.toUpperCase(); }).filter(function (x) { return known.indexOf(x) >= 0; });
              fp.forEach(function (x) { if (down.indexOf(x) < 0) down.push(x); });

          if (p.state === 'down' && pr.state === 'down') st = 'down';
          else if (p.state === 'up' && pr.state === 'up') st = 'up';
          else if (p.state === 'down' || pr.state === 'down') st = 'protected';
          else st = 'partial';
          var svc = p.svc === 'up' && pr.svc === 'up' ? 'up' : p.svc === 'down' && pr.svc === 'down' ? 'down' : 'degraded';
          return { sys: sys, cable: x.cable, med: x.med, red: x.red, primary: p, protection: pr, state: st, svc: svc, faults: fs };
        });
        out.status = worst(here.map(function (f) { return f.severity; }));
      } else {
        out.rows = (c.cables || []).map(function (id) {
          var sys = find(id);
          var fs = here.filter(function (f) { return sys && f.mapped.indexOf(sys) >= 0; });
          var liveHere = !!sys && !sys.planned && sys.route.some(function (r) {
            return !r.planned && (r.path || []).some(function (q) { return inBox(q[0], q[1], b, 1); });
          });

          return { sys: sys, cable: id, planned: pl, state: sys && !liveHere ? 'planned' : worst(fs.map(function (f) { return f.severity; })),

        });

      }
      return out;
    });

    var openMapped = open.filter(function (f) { return f.mapped.length || view === 'global'; });
    var affected = {};

<script>/* core/goc-cablemap.js */
/* ═══════════════════════════════════════════════════════════════════════════
   GOC CABLE MAP — turns the cable routes into drawable geometry for the map
   ───────────────────────────────────────────────────────────────────────────
   • Lanes: cables that share a corridor are spread side by side (metro-map
     style) in a fixed order, squeezed where the sea is narrow, and gathered
     back onto their landing stations. The data stays geographic — this is
     only how it is drawn.

     (used for the light pulses and the trace that runs along a cable when it
     is put in the spotlight).

            if (!members[o.sys.id] || dx * dx + dy * dy < members[o.sys.id].d2) members[o.sys.id] = { c: cc >= 0 ? 1 : -1, d2: dx * dx + dy * dy };

    pieces.forEach(function (pc) {

        var joint = pieces.some(function (o) { return o !== pc && o.sys === pc.sys &&
          (Math.hypot(o.raw[0][0] - p[0], o.raw[0][1] - p[1]) < 2 || Math.hypot(o.raw[o.raw.length - 1][0] - p[0], o.raw[o.raw.length - 1][1] - p[1]) < 2); });

        if (!st) { var p = proj(l.lon, l.lat); st = stations[k] = { key: k, name: l.station, cc: l.cc, lon: l.lon, lat: l.lat, x: p[0], y: p[1], home: !!homeIso[l.cc], systems: [], live: 0 }; stList.push(st); }
        if (st.systems.indexOf(s) < 0) st.systems.push(s);

    var bb = [1e9, 1e9, -1e9, -1e9];
    pieces.forEach(function (p) { p.bb = [1e9, 1e9, -1e9, -1e9]; p.pts.forEach(function (q) { p.bb[0] = Math.min(p.bb[0], q[0]); p.bb[1] = Math.min(p.bb[1], q[1]); p.bb[2] = Math.max(p.bb[2], q[0]); p.bb[3] = Math.max(p.bb[3], q[1]); });
      bb[0] = Math.min(bb[0], p.bb[0]); bb[1] = Math.min(bb[1], p.bb[1]); bb[2] = Math.max(bb[2], p.bb[2]); bb[3] = Math.max(bb[3], p.bb[3]); });

        var nb = nearestOnPolyline(p.pts, x, y); if (nb && nb.d <= max && (!best || nb.d < best.d)) best = { d: nb.d, piece: p, sys: p.sys, x: nb.x, y: nb.y };

    if ((el = t.closest('.flt'))) { var x = N.faults.open.filter(function (q) { return q.id === el.dataset.f; })[0]; if (x && x.mapped.length && x.placed) setFocus({ type: 'fault', id: x.id }); return; }
    if ((el = t.closest('.cpx-r'))) { if (el.dataset.id) setFocus({ type: 'cable', id: el.dataset.id }); return; }
    if ((el = t.closest('.cp'))) { var cid = el.dataset.cp, back = focus && focus.type === 'choke' && focus.id === cid; setFocus(back ? null : { type: 'choke', id: cid }, back ? HOME : null); return; }
  });
  $('zIn').addEventListener('click', function () { zoomAt(V.x, V.y, 1.8, true); });
  $('zOut').addEventListener('click', function () { zoomAt(V.x, V.y, 1 / 1.8, true); });
  $('zHome').addEventListener('click', function () { setFocus(null, HOME); });
  var uiT = 0;
  function showZoomUI(mouse) {
    $('zoomui').classList.add('show'); if (mouse) $('stage').classList.add('mouse');
    clearTimeout(uiT); uiT = setTimeout(function () { $('zoomui').classList.remove('show'); $('stage').classList.remove('mouse'); }, 4000);
  }
  function zoomReadout(c) { $('zLvl').textContent = '×' + ((c || cam).z).toFixed(1); }
  function cycle(type, list, dir) {
    var cur = focus && focus.type === type ? list.indexOf(focus.id) : -1;
    var i = (cur + dir + list.length) % list.length; if (cur < 0 && dir < 0) i = list.length - 1;
    if (list.length) setFocus({ type: type, id: list[i] });
  }
  addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'Escape' || k === '0' || k === 'Home' || k === 'h' || k === 'H') setFocus(null, HOME);
    else if (k === '+' || k === '=') zoomAt(V.x, V.y, 1.8, true);
    else if (k === '-' || k === '_') zoomAt(V.x, V.y, 1 / 1.8, true);
    else if (e.shiftKey && /^Arrow/.test(k)) panBy(k === 'ArrowLeft' ? -500 : k === 'ArrowRight' ? 500 : 0, k === 'ArrowUp' ? -400 : k === 'ArrowDown' ? 400 : 0);
    else if (k === 'ArrowRight' || k === 'ArrowLeft') cycle('cable', N.systems.map(function (s) { return s.id; }), k === 'ArrowRight' ? 1 : -1);
    else if (k === 'f' || k === 'F') cycle('fault', N.faults.open.filter(function (f) { return f.placed && f.mapped.length; }).map(function (f) { return f.id; }), 1);
    else if (k === 'c' || k === 'C') cycle('choke', N.chokepoints.map(function (c) { return c.id; }), 1);
    else if (k === 't' || k === 'T') { tourOn = !tourOn; holdUntil = 0; if (tourOn) schedule(0); else { clearTimeout(stepT); spotlight(R, {}); } }
  });
  window.__focus = function () { return focus ? focus.type + ':' + focus.id : 'all'; };
  window.__camera = function () { var ll = P0.invert(cam.x, cam.y); return { lon: +ll[0].toFixed(2), lat: +ll[1].toFixed(2), zoom: +cam.z.toFixed(2) }; };
  /* tablet: 0 / 'all' = whole network, n = n-th cable, 'cable:id' 'fault:id' 'choke:id' 'station:name',
     'zoom:in' 'zoom:out' 'zoom:home' 'zoom:3' (level), 'goto:lon,lat,zoom', 'pan:left|right|up|down', 'tour:on' 'tour:off' */
  window.__setView = function (v) {
    if (typeof v === 'number' || /^\d+$/.test(String(v))) { var n = +v; setFocus(n > 0 && N.systems[n - 1] ? { type: 'cable', id: N.systems[n - 1].id } : null); return; }
    var m = String(v || '').match(/^(\w+):(.+)$/);
    if (!m) { setFocus(null, HOME); return; }
    if (m[1] === 'tour') { tourOn = m[2] !== 'off'; holdUntil = 0; if (tourOn) schedule(0); else { clearTimeout(stepT); spotlight(R, {}); } return; }
    if (m[1] === 'zoom') {
      if (m[2] === 'home') { setFocus(focus, HOME); return; }
      var zk = m[2] === 'in' ? 1.8 : m[2] === 'out' ? 1 / 1.8 : NaN, zl = parseFloat(m[2]);
      if (isFinite(zk) || isFinite(zl)) { freeze(); hold(); go({ x: visual.x, y: visual.y, z: isFinite(zk) ? visual.z * zk : zl }, focus, { manual: true, zoom: true }); }
      return;
    }
    if (m[1] === 'pan') { var dir = m[2]; panBy(dir === 'left' ? -500 : dir === 'right' ? 500 : 0, dir === 'up' ? -400 : dir === 'down' ? 400 : 0); return; }
    if (m[1] === 'goto') { var g = m[2].split(',').map(parseFloat); if (g.length >= 2 && isFinite(g[0]) && isFinite(g[1])) { freeze(); var q = P0(g[0], g[1]); hold(); go({ x: q[0], y: q[1], z: g[2] || visual.z }, focus, { manual: true }); } return; }
    setFocus({ type: m[1], id: m[2] });
  };
})();
