<style>
  :root{
    --ink:#0a0313; --sea:#1bced8; --coral:#ff375e; --moon:#a54ee1;
    --text:#f2ecf7; --dim:#d3cae6; --dimmer:#ab9fca;
    /* translucent again — transparency is cheap; it was backdrop-filter that was not */
    --card:rgba(10,3,19,.56); --cardLine:rgba(165,78,225,.26); --chip:rgba(10,3,19,.58);
    --iconFill:rgba(255,55,94,.09); --iconLine:rgba(255,55,94,.28);
    --barTrack:rgba(255,255,255,.09);

  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --shift:640px; }   /* the whole dashboard sits right; the open band is on the left */
  html,body{width:5280px;height:1800px;overflow:hidden;}
  body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;cursor:none;}
  .stage{position:relative;width:5280px;height:1800px;overflow:hidden;
    background:
      radial-gradient(1200px 1860px at 9% 50%, rgba(165,78,225,.13), transparent 70%),
      radial-gradient(1200px 1860px at 91% 50%, rgba(165,78,225,.13), transparent 70%),
      radial-gradient(3400px 1860px at 52% 50%, rgba(10,3,19,0) 46%, rgba(10,3,19,.74) 100%),
      radial-gradient(3200px 1860px at 52% 66%, #2c0c50 0%, #1a0630 52%, #0a0313 100%);}

  /* static map — never touched after load */
  #map{position:absolute;left:0;top:0;z-index:1;width:6050px;height:1800px;
       transition:opacity .5s ease;
       -webkit-mask-image:linear-gradient(to right, transparent 300px, #000 1180px,
                                          #000 100%);
       mask-image:linear-gradient(to right, transparent 300px, #000 1180px,
                                  #000 100%);}


  /* animated layer — one canvas, half resolution, scaled up */
  #fx{position:absolute;left:0;top:0;z-index:3;width:6050px;height:1800px;
      pointer-events:none;transition:opacity .5s ease;}

  .scrim{position:absolute;left:0;right:0;top:0;height:860px;z-index:4;pointer-events:none;

    text-transform:uppercase;color:var(--dimmer);}

  .dots span.on{background:var(--coral);border-color:var(--coral);}

  .kcard{flex:1 1 0;position:relative;overflow:hidden;min-height:0;
    border:1px solid var(--cardLine);border-radius:20px;background:var(--card);

    display:flex;flex-direction:column;justify-content:center;gap:16px;padding:28px 36px;}
  .kcard .lab{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#fff;line-height:1.15;}

  .kcard .note{font-family:'IBM Plex Mono',monospace;font-size:23px;letter-spacing:.06em;color:var(--dim);}
  .kcard .bar{height:14px;border-radius:7px;background:var(--barTrack);overflow:hidden;}
  .kcard .bar i{display:block;height:100%;border-radius:6px;width:0;

  /* ══════════════════════════════════════════════════════════════════════
     VIEW 3 — Data Centers

  .dchead{position:absolute;left:50%;top:74px;transform:translateX(calc(-50% + var(--shift)));

  .dchead .kick{font-family:'IBM Plex Mono',monospace;font-size:21px;letter-spacing:.34em;

  .dclab{position:absolute;transform:translate(-50%,0);text-align:center;white-space:nowrap;

  .dclab .s{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.12em;

<div class="stage" id="stage">

<svg id="map" viewBox="0 0 6050 1800">

    <linearGradient id="landG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1268"/><stop offset="100%" stop-color="#1d0733"/>
    </linearGradient>
    <linearGradient id="homeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a24b0"/><stop offset="100%" stop-color="#3c1070"/>
    </linearGradient>
  </defs>
  <g id="grat"></g>
  <g id="land" fill="url(#landG)" stroke="rgba(165,78,225,.34)" stroke-width="1.6"></g>
  <g id="home" fill="url(#homeG)" stroke="rgba(255,55,94,.75)" stroke-width="3"></g>
  <g id="arcs" fill="none" stroke="rgba(190,140,245,.40)" stroke-width="2.6"
     stroke-dasharray="16 22" stroke-linecap="round"></g>
</svg>

<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var NS = 'http://www.w3.org/2000/svg';

  /* ─────────── static map, built once ─────────── */
  $('grat').innerHTML = MAP.grat || '';
  $('land').innerHTML = MAP.land.map(function(d){ return '<path d="'+d+'"/>'; }).join('');
  $('home').innerHTML = MAP.home.map(function(d){ return '<path d="'+d+'"/>'; }).join('');

  var ROUTES = [
    ['Jeddah','London'], ['Jeddah','Marseille'], ['Jeddah','Cairo'],
    ['Jeddah','Djibouti'], ['Jeddah','Nairobi'],
    ['Riyadh','Istanbul'], ['Riyadh','Karachi'],
    ['Dammam','Mumbai'],  ['Dammam','Singapore']
  ];

  /* build the arcs in the SVG, then sample them ONCE into plain arrays.
     After this the SVG is never touched again — no getPointAtLength per frame. */
  var arcsG = $('arcs'), arcs = [], SAMPLES = 200;
  ROUTES.forEach(function(r){
    var a = MAP.cities[r[0]], c = MAP.reach[r[1]];
    if(!a || !c) return;
    var mx=(a[0]+c[0])/2, my=(a[1]+c[1])/2, dx=c[0]-a[0], dy=c[1]-a[1], k=0.17;
    var c1=[mx-dy*k,my+dx*k], c2=[mx+dy*k,my-dx*k];
    var cc=(c1[1]<c2[1])?c1:c2;
    var cx=cc[0], cy=Math.max(150,cc[1]);
    var p = document.createElementNS(NS,'path');
    p.setAttribute('d','M'+a[0]+','+a[1]+' Q'+cx.toFixed(1)+','+cy.toFixed(1)+' '+c[0]+','+c[1]);
    arcsG.appendChild(p);
    var L = p.getTotalLength(), pts = new Float32Array(SAMPLES*2);
    for(var i=0;i<SAMPLES;i++){
      var pt = p.getPointAtLength(L*i/(SAMPLES-1));
      pts[i*2] = pt.x; pts[i*2+1] = pt.y;
    }
    arcs.push({ pts:pts, from:a, to:c });
  });

  /* ─────────── canvas effects layer ─────────── */
  /* the canvas covers only the box the arcs actually occupy — about a third
     of the map — so every frame clears and paints a fraction of the pixels */
  var S = CONFIG.renderScale || 0.5, PAD = 170;
  var bx0=Infinity, by0=Infinity, bx1=-Infinity, by1=-Infinity;
  arcs.forEach(function(a){ for(var i=0;i<a.pts.length;i+=2){
    var x=a.pts[i], y=a.pts[i+1];
    if(x<bx0) bx0=x; if(x>bx1) bx1=x; if(y<by0) by0=y; if(y>by1) by1=y; } });
  if(!isFinite(bx0)){ bx0=0; by0=0; bx1=6050; by1=1800; }
  var OX = Math.max(0, Math.floor(bx0-PAD)), OY = Math.max(0, Math.floor(by0-PAD));
  var CW = Math.min(6050, Math.ceil(bx1+PAD)) - OX, H = Math.min(1800, Math.ceil(by1+PAD)) - OY;
  var cv = $('fx'), ctx = cv.getContext('2d', { alpha:true });
  cv.style.left = OX+'px'; cv.style.top = OY+'px'; cv.style.width = CW+'px'; cv.style.height = H+'px';
  cv.width = Math.round(CW*S); cv.height = Math.round(H*S);
  ctx.setTransform(S,0,0,S,-OX*S,-OY*S);   // draw in full-wall coordinates
  var W = CW;

  // one pre-rendered glow sprite, reused for every packet head
  var glow = document.createElement('canvas'); glow.width = glow.height = 120;
  (function(){
    var g = glow.getContext('2d');
    var rg = g.createRadialGradient(60,60,0,60,60,60);
    rg.addColorStop(0,'rgba(210,252,255,.80)');
    rg.addColorStop(.20,'rgba(120,240,250,.42)');
    rg.addColorStop(.50,'rgba(27,206,216,.14)');
    rg.addColorStop(1,'rgba(27,206,216,0)');
    g.fillStyle = rg; g.fillRect(0,0,120,120);
  })();

  var SITES = CONFIG.sites.map(function(s){
    var p = MAP.cities[s.key]; return p ? {x:p[0], y:p[1]} : null;
  }).filter(Boolean);
  var DESTS = Object.keys(MAP.reach).map(function(k){
    return { x:MAP.reach[k][0], y:MAP.reach[k][1] };
  });

  var PPA = Math.max(1, CONFIG.packetsPerArc||2);
  var PERIOD = (CONFIG.packetSeconds||9)*1000;
  var FRAME = 1000/(CONFIG.fps||30);
  var last = 0, dim = 1, running = true;

  function pt(a,i){ return { x:a.pts[i*2], y:a.pts[i*2+1] }; }

  function drawNodes(t){
    for(var s2=0;s2<SITES.length;s2++){
      var st2 = SITES[s2];
      ctx.fillStyle = 'rgba(255,55,94,.14)';
      ctx.beginPath(); ctx.arc(st2.x, st2.y, 28, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ff375e';
      ctx.beginPath(); ctx.arc(st2.x, st2.y, 10, 0, 6.283); ctx.fill();
    }
    for(var d2=0;d2<DESTS.length;d2++){
      var de2 = DESTS[d2];
      ctx.fillStyle = 'rgba(27,206,216,.55)';
      ctx.beginPath(); ctx.arc(de2.x, de2.y, 6, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(27,206,216,.14)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(de2.x, de2.y, 19, 0, 6.283); ctx.stroke();
    }
  }
  function freeze(){                       // one calm static frame, then stop drawing
    ctx.clearRect(OX,OY,CW,H);
    ctx.globalAlpha = 1;
    drawNodes(0);
  }

  function frame(t){
    requestAnimationFrame(frame);
    if(!running) return;
    if(t - last < FRAME) return;          // fps cap
    last = t;

    ctx.clearRect(OX,OY,CW,H);
    ctx.globalAlpha = dim;

    /* ── data packets: a bright head with a tapering streak behind it ── */
    ctx.lineCap = 'round';
    for(var a=0;a<arcs.length;a++){
      var arc = arcs[a];
      for(var q=0;q<PPA;q++){
        var f = ((t/PERIOD) + q/PPA + a*0.11) % 1;
        var i = Math.floor(f*(SAMPLES-1));
        // comet streak: a soft wide pass, then a bright narrow core
        for(var pass=0;pass<2;pass++){
          for(var k=0;k<9;k++){
            var i1 = i - k*2, i0 = i - (k+1)*2;
            if(i0 < 0) break;
            var p0 = pt(arc,i0), p1 = pt(arc,i1);
            var fade = 1 - k/9;
            if(pass===0){
              ctx.strokeStyle = 'rgba(27,206,216,'+(0.14*fade).toFixed(3)+')';
              ctx.lineWidth = 15*fade + 3;
            } else {
              ctx.strokeStyle = 'rgba(170,246,255,'+(0.70*fade*fade).toFixed(3)+')';
              ctx.lineWidth = 5*fade + 1.2;
            }
            ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
          }
        }
        var h = pt(arc,i);
        ctx.drawImage(glow, h.x-60, h.y-60);
        ctx.fillStyle = '#f2ffff';
        ctx.beginPath(); ctx.arc(h.x,h.y,5,0,6.283); ctx.fill();

        // launch flash at the origin, arrival flash at the far end
        if(f < 0.10){
          var e = f/0.10;
          ctx.strokeStyle = 'rgba(255,55,94,'+(0.75*(1-e)).toFixed(3)+')';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(arc.from[0],arc.from[1],14+e*62,0,6.283); ctx.stroke();
        } else if(f > 0.90){
          var e2 = (f-0.90)/0.10;
          ctx.strokeStyle = 'rgba(27,206,216,'+(0.70*(1-e2)).toFixed(3)+')';
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(arc.to[0],arc.to[1],8+e2*34,0,6.283); ctx.stroke();
        }
      }
    }

    /* ── our three sites: steady radar beacon ── */
    for(var s=0;s<SITES.length;s++){
      var st = SITES[s];
      for(var r=0;r<2;r++){
        var pr = ((t/3400) + s*0.33 + r*0.5) % 1;
        ctx.strokeStyle = 'rgba(255,55,94,'+(0.55*(1-pr)).toFixed(3)+')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(st.x, st.y, 14 + pr*74, 0, 6.283); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,55,94,.14)';
      ctx.beginPath(); ctx.arc(st.x, st.y, 28, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ff375e';
      ctx.beginPath(); ctx.arc(st.x, st.y, 10, 0, 6.283); ctx.fill();
    }

    /* ── destination nodes: quiet breathing dots ── */
    for(var d=0;d<DESTS.length;d++){
      var de = DESTS[d], b = 0.45 + 0.55*Math.sin(t/1100 + d);
      ctx.fillStyle = 'rgba(27,206,216,'+(0.30+0.45*b).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(de.x, de.y, 6, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(27,206,216,'+(0.22*b).toFixed(3)+')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(de.x, de.y, 16+6*b, 0, 6.283); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);

  /* ─────────── content ─────────── */
  $('footRight').innerHTML = CONFIG.footRight;
  $('gKick').textContent   = CONFIG.kicker;
  $('gTitle').textContent  = CONFIG.title;
  $('nTitle').textContent  = CONFIG.numTitle;
  $('nNote').textContent   = CONFIG.numNote || '';
  $('gChips').innerHTML = CONFIG.chips.map(function(c){ return '<div class="chip">'+c+'</div>'; }).join('');

  var ICONS = {
    command:'<rect x="2" y="2.5" width="5.4" height="4.6" rx="1"/><rect x="9.3" y="2.5" width="5.4" height="4.6" rx="1"/><rect x="16.6" y="2.5" width="5.4" height="4.6" rx="1"/><path d="M4.7 7.1v3.1h14.6V7.1M12 7.1v3.1M12 10.2v7.4M12 21l-3-3.4h6L12 21z"/>',
    innov:'<rect x="3" y="2.5" width="18" height="14" rx="2"/><path d="M6 13.5l3.6-4.2 2.6 2.9 2.3-2.6 3.5 3.9"/><circle cx="7.5" cy="19.5" r="3.2"/><path d="M7.5 17.9v1.6l1.1.9"/>',
    globe:'<circle cx="12" cy="12" r="9.4"/><path d="M12 2.6c-3 3-3 15.8 0 18.8M12 2.6c3 3 3 15.8 0 18.8M2.9 8.4h18.2M2.9 15.6h18.2"/>',
    uptime:'<circle cx="12" cy="13.4" r="8.3"/><path d="M9.4 2.2h5.2M12 2.2v2.9M18.6 6.8l1.7-1.7M12 13.4l3.4-3.4"/>',
    coe:'<path d="M5 2.6h9.2L19 7.3v14.1H5z"/><path d="M14 2.6v4.9h5"/><circle cx="12" cy="13.6" r="2.9"/><path d="M10.3 16.1 9.4 20l2.6-1.4 2.6 1.4-.9-3.9"/>',
    resil:'<path d="M10 3.4c1.6 3 1.6 14.2 0 17.2M14 3.4c-1.6 3-1.6 14.2 0 17.2"/><path d="M1.6 12h5.6M5.2 9.6 7.6 12l-2.4 2.4M22.4 12h-5.6M18.8 9.6 16.4 12l2.4 2.4"/>'
  };
  $('pillars').innerHTML = CONFIG.features.map(function(f,i){
    return '<div class="pillar" data-anim style="animation:rise .8s '+(0.5+i*0.08)+'s both">'+
      '<div class="ph"><div class="ic"><svg viewBox="0 0 24 24">'+(ICONS[f.icon]||ICONS.globe)+'</svg></div>'+
      '<h3>'+f.title+'</h3></div>'+
      '<ul>'+f.items.map(function(t){ return '<li><i></i><span>'+t+'</span></li>'; }).join('')+'</ul></div>';
  }).join('');

  var labs = $('siteLabels');
  CONFIG.sites.forEach(function(s){
    var p = MAP.cities[s.key]; if(!p) return;
    var lx = p[0] + (s.dx||0), ly = p[1] + (s.dy||40);
    labs.insertAdjacentHTML('beforeend',
      '<div class="sitelab" style="left:'+lx+'px;top:'+ly+'px">'+
        '<div class="n">'+s.label+'</div><div class="s">'+s.sub+'</div>'+
        (s.ix?'<div class="ix">'+s.ix+'</div>':'')+'</div>');
  });

  var gi = 0;
  $('groups').innerHTML = CONFIG.groups.map(function(g){
    return '<div class="col">'+
      '<div class="cat" data-anim style="animation:fadein .7s '+(0.05+gi*0.05)+'s both">'+g.title+'</div>'+
      g.items.map(function(k){
        gi++;
        var bar = k.bar ? '<div class="bar"><i data-w="'+
          Math.max(0,Math.min(100,100*k.bar.v/k.bar.max)).toFixed(1)+'"></i></div>' : '';
        return '<div class="kcard" data-anim style="animation:rise .7s '+(0.08+gi*0.04)+'s both">'+
          '<div class="lab">'+k.label+'</div>'+
          '<div class="val"><span class="num" data-v="'+k.value+'">'+k.value+'</span>'+
            (k.unit?'<small>'+k.unit+'</small>':'')+'</div>'+
          bar+
          (k.target?'<div class="tgt">'+k.target+'</div>':'')+
          (k.note?'<div class="note">'+k.note+'</div>':'')+
        '</div>';
      }).join('')+'</div>';
  }).join('');

  function countUp(el,text,ms){
    var raw = String(text).replace(/,/g,'');
    if(!/^\d+(\.\d+)?$/.test(raw)){ el.textContent = text; return; }
    var target = parseFloat(raw), dec = (raw.split('.')[1]||'').length, t0 = performance.now();
    (function step(t){
      var p = Math.min(1,(t-t0)/(ms||1100)), e = 1-Math.pow(1-p,3), v = target*e;
      el.textContent = dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-US');
      if(p<1) requestAnimationFrame(step); else el.textContent = text;
    })(t0);
  }

  /* ─────────── navigation ─────────── */
  var views = Array.prototype.slice.call(document.querySelectorAll('.view'));
  var dotsEl = $('dots'), map = $('map'), fx = $('fx');
  dotsEl.innerHTML = views.map(function(_,i){ return '<span'+(i===0?' class="on"':'')+'></span>'; }).join('');
  var cur = 0, timer = null;

  function show(i){
    i = (i+views.length)%views.length; cur = i;
    views.forEach(function(v,k){
      v.classList.toggle('on', k===i);
      if(k===i) v.querySelectorAll('[data-anim]').forEach(function(el){
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      });
    });
    map.style.opacity = (i===1) ? .42 : (i===2 ? .26 : 1);
    fx.style.opacity  = (i===1) ? .42 : (i===2 ? 0   : 1);
    if(i>=1){ running = false; setTimeout(freeze, 60); }
    else { running = true; }
    if(i===2 && window.__dcInit) window.__dcInit();
    Array.prototype.forEach.call(dotsEl.children,function(d,k){ d.classList.toggle('on',k===i); });
    if(i===1){
      views[1].querySelectorAll('.num').forEach(function(el,k){
        el.textContent = /^[\d.,]+$/.test(el.dataset.v) ? '0' : el.dataset.v;
        setTimeout(function(){ countUp(el, el.dataset.v, 1000); }, 200+k*60);
      });
      views[1].querySelectorAll('.bar i').forEach(function(el,k){
        el.style.width = '0';
        setTimeout(function(){ el.style.width = el.dataset.w+'%'; }, 650+k*100);
      });
    }
    if(timer) clearInterval(timer);
    if(CONFIG.autoRotate) timer = setInterval(function(){ show(cur+1); }, CONFIG.autoRotateSeconds*1000);
  }
  window.__setView = function(n){ show((n|0) - 1); };   // 1-based, for the control tablet
  document.addEventListener('click', function(){ show(cur+1); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); show(cur+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); show(cur-1); }
    else if(/^[12]$/.test(e.key)) show(parseInt(e.key,10)-1);
  });
  show(0);
})();
</script>











<script>
/* ═══════════════════════════════════════════════════════════════════════════
   WALL SYNC — listens for scene changes from the control tablet.

   Harmless when goc-server.py is not running, or when this file is opened
   straight from disk: the connection simply fails and the dashboard keeps
   working exactly as before (click, arrow keys, number keys).

   The wall is three sections. Only the left one changes: the middle always
   shows the Internet Exchanges and the right always shows the subsea map.
   ROLE says which section this file is: "left", "middle" or "right".
   ═══════════════════════════════════════════════════════════════════════════ */
(function(){
  var ROLE   = 'left';
  var SCENES = {
    welcome:     { left:1, middle:1, right:1 },   // greeting + capabilities
    numbers:     { left:2, middle:1, right:1 },   // key indicators
    datacenters: { left:3, middle:1, right:1 }    // data centers
  };

  function apply(scene){
    var s = SCENES[scene];
    if(!s || typeof window.__setView !== 'function') return;
    window.__setView(s[ROLE]);
  }

  /* ── path A ▸ same browser, no server ────────────────────────────────
     Lets you try the whole thing on one PC: open this file, the other
     dashboard and goc-control.html in three windows and the buttons work.
     Also harmless once the server is running. ─────────────────────────── */
  try{
    var ch = new BroadcastChannel('goc-wall');
    ch.onmessage = function(e){ if(e.data && e.data.scene) apply(e.data.scene); };
  }catch(e){}
  addEventListener('storage', function(e){
    if(e.key !== 'goc-wall-scene' || !e.newValue) return;
    try{ apply(JSON.parse(e.newValue).scene); }catch(err){}
  });

  /* ── path B ▸ the tablet, over the network, via goc-server.py ───────── */
  var es = null, retry = null;
  function connect(){
    if(!window.EventSource || location.protocol === 'file:') return;
    try{ es = new EventSource('/api/events'); }catch(e){ return; }
    es.onmessage = function(ev){
      try{ apply(JSON.parse(ev.data).scene); }catch(e){}
    };
    es.onerror = function(){
      try{ es.close(); }catch(e){}
      if(!retry) retry = setTimeout(function(){ retry = null; connect(); }, 4000);
    };
  }
  connect();
})();
</script>








<script>
/* ═══════════════ VIEW 3 — Data Centers ═══════════════ */
window.__dcInit = (function(){
  var $ = function(i){ return document.getElementById(i); };
  var C = DC_CONFIG, M = SAUDI;

  $('dcKick').textContent   = C.kicker;
  $('dcTitle').textContent  = C.title;
  $('dcTarget').innerHTML   = 'Build-out target <b>' + C.totals.target + '</b>';
  $('dcNote').textContent   = C.note;

  $('dcLandG').innerHTML = M.land.map(function(d){ return '<path d="'+d+'"/>'; }).join('');
  $('dcHomeG').innerHTML = M.home.map(function(d){ return '<path d="'+d+'"/>'; }).join('');

  /* markers — a ring for the three facilities on cards, a dot for the rest */
  var major = {};
  C.sites.forEach(function(s){ major[s.city] = true; });
  var dots = '', labs = '';
  C.mapSites.forEach(function(s){
    var p = M.sites[s.city]; if(!p) return;
    var big = !s.minor && major[s.city];
    if(big){
      dots += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="34" fill="none" '
           +  'stroke="rgba(255,55,94,.30)" stroke-width="2"/>'
           +  '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="20" fill="none" '
           +  'stroke="rgba(255,55,94,.55)" stroke-width="2.5"/>'
           +  '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="#ff375e"/>';
    } else {
      dots += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="12" fill="rgba(27,206,216,.16)"/>'
           +  '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5.5" fill="#1bced8"/>';
    }
    labs += '<div class="dclab'+(s.minor?' minor':'')
         +  '" data-x="'+p[0]+'" data-y="'+p[1]
         +  '" data-dx="'+(s.dx||0)+'" data-dy="'+(s.dy||0)+'">'
         +  '<div class="n">'+s.label+'</div>'
         +  (s.sub ? '<div class="s">'+s.sub+'</div>' : '')
         +  '</div>';
  });
  $('dcDots').innerHTML = dots;
  $('dcLabels').innerHTML = labs;

  /* measure where the svg actually sits, rather than assuming — the card
     size changes with the section width and this stays correct either way */
  function placeLabels(){
    var svg = $('dcSvg'), box = svg.parentNode;
    var r = svg.getBoundingClientRect(), b = box.getBoundingClientRect();
    if(!r.width) return;
    var ox = r.left - b.left, oy = r.top - b.top;
    var kx = r.width/1460, ky = r.height/1060;
    $('dcLabels').querySelectorAll('.dclab').forEach(function(el){
      el.style.left = (ox + (+el.dataset.x)*kx + (+el.dataset.dx)).toFixed(0)+'px';
      el.style.top  = (oy + (+el.dataset.y)*ky + (+el.dataset.dy)).toFixed(0)+'px';
    });
  }
  placeLabels();
  addEventListener('resize', placeLabels);

  function bar(k, val, tot, unit, pct){
    return '<div class="dcbar'+(pct?' '+pct:'')+'">'
      + '<div class="t"><span class="k">'+k+'</span>'
      + '<span class="v">'+val+'<small>of '+tot+' '+unit+'</small></span></div>'
      + '<div class="track"><i data-w="'+Math.round(val/tot*100)+'"></i></div></div>';
  }

  $('dcCards').innerHTML = C.sites.map(function(s){
    return '<div class="dccard">'
      + '<div class="id"><div class="n">'+s.name+'</div>'
      +   '<div class="c">'+s.city+' · '+s.code+'</div>'
      +   '<div class="tags"><span>'+s.tier+'</span><span>'+s.power+' power</span>'
      +     '<span>'+s.cooling+' cooling</span><span>PUE '+s.pue.toFixed(2)+'</span></div></div>'
      + '<div class="dcbars">'
      +   bar('IT load',  s.mw[0].toFixed(1), s.mw[1].toFixed(1), 'MW')
      +   bar('Racks',    s.racks[0],         s.racks[1],         'racks')
      + '</div></div>';
  }).join('');

  $('dcCerts').innerHTML = C.certs.map(function(c){
    return '<div class="dccert"><div class="k">'+c.k+'</div><div class="v">'+c.v+'</div></div>';
  }).join('');

  /* run the fill bars every time the view comes up */
  return function(){
    placeLabels();
    $('dcCards').querySelectorAll('.track i').forEach(function(el,k){
      el.style.width = '0';
      setTimeout(function(){ el.style.width = el.dataset.w + '%'; }, 420 + k*110);
    });
  };
})();
</script>
