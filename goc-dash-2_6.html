<style>
  :root{
    --ink:#0a0313; --sea:#1bced8; --coral:#ff375e; --moon:#a54ee1; --purple:#4f008c;
    --text:#f2ecf7; --dim:#d3cae6; --dimmer:#ab9fca;
    --cardLine:rgba(165,78,225,.26); --card:rgba(10,3,19,.56);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:5280px;height:1450px;overflow:hidden;font-size:16px;}
  body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;cursor:none;user-select:none;}
  .stage{position:relative;width:5280px;height:1450px;overflow:hidden;
    background:
      radial-gradient(1200px 1500px at 9% 50%, rgba(165,78,225,.13), transparent 70%),
      radial-gradient(1200px 1500px at 91% 50%, rgba(165,78,225,.13), transparent 70%),
      radial-gradient(3400px 1500px at 50% 50%, rgba(10,3,19,0) 46%, rgba(10,3,19,.74) 100%),
      radial-gradient(3200px 1500px at 50% 66%, #2c0c50 0%, #1a0630 52%, #0a0313 100%);}

  /* ── shared bits ─────────────────────────────────────────────────── */
  .mono{font-family:'IBM Plex Mono',monospace;}
  .lab{font-family:'IBM Plex Mono',monospace;font-size:1.2rem;letter-spacing:.16em;
       text-transform:uppercase;color:var(--dimmer);}
  .card{border:1px solid var(--cardLine);border-radius:1.25rem;background:var(--card);
        box-shadow:0 6px 16px rgba(0,0,0,.40);}

  /* a network's mark: the logo when we have one, a monogram when we don't */
  .lg{position:relative;flex:0 0 auto;border-radius:22%;overflow:hidden;
      display:grid;place-items:center;background:#fff;}
  .lg img{width:100%;height:100%;object-fit:contain;display:block;background:#fff;padding:17%;}
  .lg .mg{position:absolute;inset:0;display:grid;place-items:center;
      font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fff;letter-spacing:.02em;}
  .lg.mono-tile{background:none;}
  .lg.mono-tile .mg{border-radius:22%;border:1px solid rgba(255,255,255,.14);}

  /* ── OVERVIEW ────────────────────────────────────────────────────── */
  #overview{position:absolute;inset:0;z-index:2;transition:opacity .5s ease, transform .5s ease;}
  #overview.dim{opacity:0;transform:scale(.985);pointer-events:none;}

  .ixhead{position:absolute;left:0;right:0;top:3.2rem;text-align:center;}
  .ixhead h1{font-family:'Space Grotesk',sans-serif;font-size:4.0rem;font-weight:600;color:#fff;letter-spacing:.005em;}
  .ixhead .sub{font-family:'IBM Plex Mono',monospace;font-size:1.45rem;letter-spacing:.22em;
               text-transform:uppercase;color:var(--moon);margin-top:.7rem;}

  .ixtotals{position:absolute;left:50%;transform:translateX(-50%);top:13.8rem;display:flex;gap:1.9rem;}
  .ixtot{display:flex;align-items:baseline;gap:.6rem;font-family:'IBM Plex Mono',monospace;font-size:1.4rem;
         letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);
         border:1px solid var(--cardLine);background:var(--card);border-radius:999px;padding:.7rem 1.9rem;}
  .ixtot b{font-family:'Space Grotesk',sans-serif;font-size:2.25rem;font-weight:600;color:#fff;letter-spacing:0;}
  .ixtot i{font-style:normal;color:var(--sea);}

  .ixgrid{position:absolute;left:2.2rem;right:2.2rem;top:19.4rem;bottom:3.6rem;
          display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;}
  .ixcard{position:relative;overflow:hidden;min-width:0;padding:1.7rem 1.9rem;
          display:flex;flex-direction:column;gap:1.4rem;
          transition:border-color .25s ease, transform .25s ease;}
  .ixcard:hover, .ixcard.hot{border-color:rgba(27,206,216,.55);transform:translateY(-4px);}
  .ixcard .hint{display:flex;align-items:center;justify-content:flex-end;gap:.6rem;margin-top:.7rem;
                font-family:'IBM Plex Mono',monospace;font-size:1.05rem;letter-spacing:.16em;
                text-transform:uppercase;color:var(--dimmer);}
  .ixcard .hint i{width:2rem;height:2rem;border-radius:50%;border:1px solid rgba(27,206,216,.5);
                  display:grid;place-items:center;color:#7fe6ee;font-style:normal;font-size:1.1rem;}

  .ixtop{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;}
  .ixname{font-family:'Space Grotesk',sans-serif;font-size:2.7rem;font-weight:600;color:#fff;line-height:1.1;}
  .ixsite{font-family:'IBM Plex Mono',monospace;font-size:1.2rem;letter-spacing:.12em;
          text-transform:uppercase;color:var(--dimmer);margin-top:.35rem;}
  .ixcode{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:1.35rem;letter-spacing:.16em;
          color:#7fe6ee;padding:.5rem 1.15rem;border-radius:.6rem;
          border:1px solid rgba(27,206,216,.55);background:rgba(27,206,216,.13);}

  .ixkpis{display:flex;gap:2.6rem;}
  .ixkpi .v{display:flex;align-items:baseline;gap:.4rem;line-height:1;margin-top:.25rem;
            font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:3.7rem;color:#fff;}
  .ixkpi .v small{font-size:1.8rem;font-weight:500;color:var(--sea);}

  .ixchart .ct{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.55rem;}
  .ixchart .ct em{font-style:normal;color:var(--dim);font-family:'IBM Plex Mono',monospace;
                  font-size:1.2rem;letter-spacing:.14em;text-transform:uppercase;}
  .ixchart .ct em b{color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.85rem;letter-spacing:0;}
  .ixchart svg{display:block;width:100%;height:15rem;overflow:visible;}
  .ixchart .xlab{display:flex;justify-content:space-between;margin-top:.55rem;
                 font-family:'IBM Plex Mono',monospace;font-size:1.1rem;color:var(--dimmer);}

  .ixpeers{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.85rem;}
  .ixpeers .lab{flex:0 0 auto;margin-bottom:.3rem;}
  .ixpeer{flex:1 1 0;min-height:0;display:grid;grid-template-columns:3.4rem 1fr auto;
          grid-template-rows:auto auto;align-content:center;align-items:center;column-gap:1.1rem;row-gap:.3rem;}
  .ixpeer .lg{width:3.4rem;height:3.4rem;grid-row:1 / span 2;}
  .ixpeer .lg .mg{font-size:1.3rem;}
  .ixpeer .n{min-width:0;font-family:'Inter',sans-serif;font-size:1.45rem;color:#fff;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ixpeer .n small{font-family:'IBM Plex Mono',monospace;font-size:1.05rem;color:var(--dimmer);margin-left:.6rem;}
  .ixpeer .g{font-family:'IBM Plex Mono',monospace;font-size:1.35rem;color:var(--dim);white-space:nowrap;}
  .ixpeer .g b{font-family:'Space Grotesk',sans-serif;font-weight:600;color:#fff;font-size:1.6rem;}
  .ixpeer .ixbar{grid-column:2 / -1;height:.55rem;border-radius:.28rem;background:rgba(165,78,225,.16);overflow:hidden;}
  .ixpeer .ixbar i{display:block;height:100%;border-radius:.2rem;background:linear-gradient(90deg,#1bced8,#a54ee1);}

  .ixfoot{position:absolute;left:2.2rem;right:2.2rem;bottom:1.1rem;z-index:19;
          display:flex;justify-content:space-between;align-items:center;
          font-family:'IBM Plex Mono',monospace;font-size:1.05rem;letter-spacing:.14em;
          text-transform:uppercase;color:var(--dimmer);}

  /* ── PEER EXPLORER ───────────────────────────────────────────────── */
  #explorer{position:absolute;inset:0;z-index:5;display:none;opacity:0;
            transition:opacity .45s ease;}
  #explorer.open{display:block;}
  #explorer.on{opacity:1;}

  .exhead{position:absolute;left:2.2rem;right:2.2rem;top:2.4rem;height:8.6rem;
          display:flex;align-items:center;gap:2.4rem;}
  .exback{display:flex;align-items:center;gap:.9rem;font-family:'IBM Plex Mono',monospace;
          font-size:1.15rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);}
  .exback i{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid rgba(165,78,225,.4);
            display:grid;place-items:center;color:var(--dim);font-style:normal;font-size:1.4rem;}
  .exid{display:flex;align-items:center;gap:1.4rem;min-width:0;}
  .exid h1{font-family:'Space Grotesk',sans-serif;font-size:4.2rem;font-weight:600;color:#fff;line-height:1;}
  .exid .site{font-family:'IBM Plex Mono',monospace;font-size:1.2rem;letter-spacing:.14em;
              text-transform:uppercase;color:var(--dimmer);margin-top:.5rem;}
  .exkpis{margin-left:auto;display:flex;gap:1.4rem;}
  .exkpi{display:flex;flex-direction:column;gap:.35rem;padding:.9rem 1.6rem;min-width:13rem;}
  .exkpi .v{display:flex;align-items:baseline;gap:.4rem;line-height:1;
            font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:2.7rem;color:#fff;}
  .exkpi .v small{font-size:1.3rem;font-weight:500;color:var(--sea);}

  .exbody{position:absolute;left:2.2rem;right:2.2rem;top:12.4rem;bottom:3.6rem;display:flex;gap:1.6rem;}

  .exside{flex:0 0 1180px;display:flex;flex-direction:column;gap:1.6rem;min-height:0;}
  .exside .card{padding:1.6rem 1.8rem;}
  .exside .ixchart svg{height:21rem;}
  .exmix{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:1.7rem;}
  .exmix .lab{margin-bottom:.2rem;}
  .exmix .ports{margin-top:auto;padding-top:1.2rem;border-top:1px solid rgba(165,78,225,.22);}
  .exmix .ports .lab{margin-bottom:.9rem;}
  .exmix .pills{display:flex;gap:.8rem;flex-wrap:wrap;}
  .exmix .pill{display:flex;align-items:baseline;gap:.5rem;padding:.6rem 1.1rem;border-radius:.8rem;
               border:1px solid var(--cardLine);background:rgba(79,0,140,.16);}
  .exmix .pill b{font-family:'Space Grotesk',sans-serif;font-size:2.1rem;font-weight:600;color:#fff;}
  .exmix .pill span{font-family:'IBM Plex Mono',monospace;font-size:1.2rem;color:var(--dimmer);letter-spacing:.08em;}
  .exmix .row{display:grid;grid-template-columns:1fr auto;row-gap:.5rem;column-gap:1rem;align-items:baseline;}
  .exmix .row .k{font-family:'Inter',sans-serif;font-size:1.7rem;color:var(--dim);}
  .exmix .row .v{font-family:'Space Grotesk',sans-serif;font-size:2.1rem;font-weight:600;color:#fff;}
  .exmix .row .v small{font-family:'IBM Plex Mono',monospace;font-size:1.2rem;color:var(--dimmer);
                       font-weight:400;margin-left:.5rem;}
  .exmix .row .bar{grid-column:1 / -1;height:.8rem;border-radius:.4rem;background:rgba(165,78,225,.16);overflow:hidden;}
  .exmix .row .bar i{display:block;height:100%;border-radius:.28rem;width:0;transition:width .9s cubic-bezier(.22,.9,.3,1);}
  .exmix .row.content .bar i{background:#1bced8;}
  .exmix .row.carrier .bar i{background:#a54ee1;}
  .exmix .row.isp     .bar i{background:#ff375e;}
  .exmix .row.other   .bar i{background:#ab9fca;}

  .exmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1.6rem;min-height:0;}

  /* marquee tiles */
  .exfeat{flex:0 0 auto;padding:1.5rem 1.8rem 1.7rem;}
  .exfeat .lab{margin-bottom:1.1rem;display:flex;justify-content:space-between;}
  .exfeat .lab span:last-child{color:var(--moon);}
  .tiles{display:grid;grid-template-columns:repeat(var(--n,10),1fr);gap:1.1rem;}
  .tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.8rem;
        padding:1.3rem .8rem 1.1rem;border-radius:1rem;border:1px solid rgba(165,78,225,.2);
        background:rgba(79,0,140,.14);min-width:0;}
  .tile .lg{width:7.4rem;height:7.4rem;border-radius:20%;}
  .tile .lg .mg{font-size:2.6rem;}
  .tile .n{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;font-weight:600;color:#fff;
           max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .a{font-family:'IBM Plex Mono',monospace;font-size:1rem;letter-spacing:.1em;color:var(--dimmer);margin-top:-.4rem;}
  .tile .p{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:600;color:var(--sea);}
  .tile .p small{font-family:'IBM Plex Mono',monospace;font-size:.95rem;color:var(--dimmer);font-weight:400;margin-left:.3rem;}

  /* everyone, grouped */
  .exall{flex:1 1 auto;min-height:0;padding:1.5rem 1.8rem;display:flex;flex-direction:column;gap:1.1rem;overflow:hidden;}
  .exall .lab{flex:0 0 auto;display:flex;justify-content:space-between;}
  .groups{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:1rem;overflow:hidden;}
  .group{min-width:0;display:flex;flex-direction:column;gap:.7rem;}
  .group .gh{display:flex;align-items:center;gap:.7rem;font-family:'IBM Plex Mono',monospace;
             font-size:1.1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
             padding-bottom:.6rem;border-bottom:1px solid rgba(165,78,225,.22);}
  .group .gh i{width:.7rem;height:.7rem;border-radius:2px;flex:0 0 auto;}
  .group.content .gh i{background:#1bced8;} .group.carrier .gh i{background:#a54ee1;}
  .group.isp .gh i{background:#ff375e;}     .group.other .gh i{background:#ab9fca;}
  .group .gh b{margin-left:auto;font-weight:400;color:var(--dimmer);}
  .chips{display:grid;grid-template-columns:repeat(7,1fr);gap:.7rem;}
  .chip{display:flex;align-items:center;gap:1rem;padding:.65rem .9rem;border-radius:.9rem;
        border:1px solid rgba(165,78,225,.16);background:rgba(10,3,19,.35);min-width:0;}
  .chip .lg{width:3.4rem;height:3.4rem;}
  .chip .lg .mg{font-size:1.35rem;}
  .chip .n{min-width:0;flex:1 1 auto;font-size:1.45rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip .n small{font-family:'IBM Plex Mono',monospace;font-size:.95rem;color:var(--dimmer);margin-left:.5rem;}
  .chip .p{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:1.15rem;color:var(--dim);}
  .chip.more{justify-content:center;color:var(--dimmer);font-family:'IBM Plex Mono',monospace;font-size:1.05rem;
             letter-spacing:.12em;text-transform:uppercase;border-style:dashed;}

  .exfoot{position:absolute;left:2.2rem;right:2.2rem;bottom:1.1rem;display:flex;justify-content:space-between;
          font-family:'IBM Plex Mono',monospace;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);}
  .exfoot .timer{display:flex;align-items:center;gap:.7rem;}
  .exfoot .timer i{width:9rem;height:.35rem;border-radius:.2rem;background:rgba(165,78,225,.18);overflow:hidden;display:block;}
  .exfoot .timer i b{display:block;height:100%;background:var(--moon);width:100%;transition:width 1s linear;}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .anim{animation:rise .6s ease both;}
</style>
</head>
<body>
<div class="stage">

  <!-- ═══ OVERVIEW ═══ -->
  <div id="overview">
    <div class="ixhead"><h1 id="ixTitle"></h1><div class="sub" id="ixSub"></div></div>
    <div class="ixtotals" id="ixTotals"></div>
    <div class="ixgrid" id="ixGrid"></div>
    <div class="ixfoot">
      <span id="ixSrc">—</span>
      <span>Tap an exchange to explore its peers</span>
      <span>24 / 7 / 365 Monitoring</span>
    </div>
  </div>

  <!-- ═══ PEER EXPLORER ═══ -->
  <div id="explorer">
    <div class="exhead">
      <div class="exback"><i>←</i><span>All exchanges</span></div>
      <div class="exid"><div><h1 id="exName"></h1><div class="site" id="exSite"></div></div>
        <div class="ixcode" id="exCode"></div></div>
      <div class="exkpis" id="exKpis"></div>
    </div>
    <div class="exbody">
      <div class="exside">
        <div class="card ixchart" id="exChart"></div>
        <div class="card exmix" id="exMix"></div>
      </div>
      <div class="exmain">
        <div class="card exfeat" id="exFeat"></div>
        <div class="card exall" id="exAll"></div>
      </div>
    </div>
    <div class="exfoot">
      <span id="exSrc">—</span>
      <span>Tap anywhere or press Esc to return</span>
      <span class="timer" id="exTimer"><span>Returning in</span><i><b></b></i></span>
    </div>
  </div>

</div>

<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var CFG = IX_CONFIG, KNOWN = CFG.known || {};
  var PDB = 'https://www.peeringdb.com/api/';

  $('ixTitle').textContent = CFG.title;
  $('ixSub').textContent   = CFG.subtitle;

  /* ─────────────────────────── formatting ─────────────────────────── */
  function tbps(g){ if(g == null) return '—'; return g >= 1000 ? (g/1000).toFixed(g >= 100000 ? 0 : 1) : g.toFixed(0); }
  function tbpsUnit(g){ return g >= 1000 ? 'Tbps' : 'Gbps'; }
  function gLabel(g){ if(g == null) return '—'; return g >= 1000 ? (g/1000).toFixed(1)+' Tbps' : Math.round(g)+' Gbps'; }
  function portLabel(g){ return g >= 1000 ? (g/1000).toFixed(g%1000?1:0)+'<small>Tbps</small>' : Math.round(g)+'<small>Gbps</small>'; }
  function hhmm(ts){ var d = new Date(ts*1000); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ─────────────────── who is this network? ─────────────────────── */
  var TYPE_OF = { 'Content':'content', 'NSP':'carrier', 'Cable/DSL/ISP':'isp' };
  var TYPE_NAME = { content:'Content & Cloud', carrier:'Carriers', isp:'ISPs', other:'Enterprise & Other' };
  var FEATURED = {};
  (CFG.featuredAsns || []).forEach(function(a){ FEATURED[a] = true; });

  function describe(p){
    /* p: { asn, name?, gbps, type?, domain?, logo? } → filled in from KNOWN */
    var k = KNOWN[p.asn] || {};
    var name = k.name || p.name || ('AS' + p.asn);
    var type = k.type || p.type || 'other';
    return { asn:p.asn, name:name, gbps:p.gbps || 0, type:type,
             domain: p.domain || k.domain || '', color: k.color || hueFor(name),
             logo: p.logo || k.logo || (typeof IX_LOGOS !== 'undefined' ? IX_LOGOS[p.asn] : '') || '',
             featured: !!FEATURED[p.asn] };
  }
  /* a typed total like 3200 Gbps becomes 8 x 400G — a guess, only used with manual figures */
  function guessPorts(list){
    var out = [];
    list.forEach(function(p){
      var g = p.gbps;
      [400,100,10].forEach(function(sz){ while(g >= sz - 1e-6){ out.push(sz); g -= sz; } });
    });
    return out;
  }
  function hueFor(name){
    var h = 0; for(var i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) % 360;
    return 'hsl('+h+', 42%, 48%)';
  }
  function initials(name){
    var w = name.replace(/[^A-Za-z0-9 &·]/g,' ').split(/[\s·&]+/).filter(Boolean);
    if(!w.length) return '?';
    if(w.length === 1) return w[0][0].toUpperCase();
    return (w[0][0] + w[1][0]).toUpperCase();
  }

  /* ───────────────────────── logos ───────────────────────────────── */
  /* candidates in order; each <img> walks the list on error and ends on the monogram */
  function logoCandidates(p){
    var c = ['logos/'+p.asn+'.png', 'logos/'+p.asn+'.svg'];
    if(p.logo) c.push(p.logo);
    if(CFG.onlineLogos && p.domain && location.protocol !== 'file:'){
      c.push('https://www.google.com/s2/favicons?domain='+p.domain+'&sz=256');
    }
    return c;
  }
  function mark(p){
    var cands = logoCandidates(p);
    return '<span class="lg mono-tile" data-c="'+esc(cands.join('|'))+'" data-i="0">'
      + '<span class="mg" style="background:'+p.color+'">'+esc(initials(p.name))+'</span>'
      + '</span>';
  }
  /* try the first candidate; on error step to the next; monogram stays underneath */
  function hydrate(root){
    root.querySelectorAll('.lg[data-c]').forEach(function(el){
      var list = el.dataset.c.split('|').filter(Boolean);
      if(!list.length) return;
      var img = new Image();
      var i = 0;
      img.onload = function(){
        if(!/^data:/.test(list[i]) && img.naturalWidth < 24){ next(); return; }   // a 16px favicon is worse than the monogram
        var ar = img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1;
        img.style.padding = ar > 2.2 ? '6%' : (ar > 1.4 ? '10%' : '17%');
        el.classList.remove('mono-tile');
        el.innerHTML = ''; el.appendChild(img);
      };
      img.onerror = next;
      function next(){ i++; if(i < list.length) img.src = list[i]; }
      img.src = list[0];
    });
  }

  /* ─────────────────── source 1 ▸ PeeringDB ──────────────────────── */
  function fromPeeringDB(ixId){
    if(!ixId || location.protocol === 'file:' && false) return Promise.resolve(null);
    if(!ixId) return Promise.resolve(null);
    return fetch(PDB+'netixlan?ix_id='+ixId+'&status=ok')
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){
        var rows = (j.data||[]).filter(function(x){ return x.operational !== false; });
        if(!rows.length) return null;
        var byNet = {}, ports = [];
        rows.forEach(function(x){ byNet[x.net_id] = (byNet[x.net_id]||0) + (x.speed||0); if(x.speed) ports.push(x.speed/1000); });
        var ids = Object.keys(byNet);
        return fetch(PDB+'net?id__in='+ids.join(',')+'&fields=id,name,asn,website,info_type')
          .then(function(r){ return r.ok ? r.json() : {data:[]}; })
          .then(function(nj){
            var nets = {};
            (nj.data||[]).forEach(function(n){ nets[n.id] = n; });
            var peers = [];
            ids.forEach(function(k){
              var n = nets[k] || {};
              if(/Route (Server|Collector)/i.test(n.info_type || '')) return;
              var dom = '';
              try{ dom = n.website ? new URL(n.website).hostname.replace(/^www\./,'') : ''; }catch(e){}
              peers.push(describe({ asn:n.asn || +k, name:n.name, gbps:byNet[k]/1000,
                                    type:TYPE_OF[n.info_type] || 'other', domain:dom }));
            });
            peers.sort(function(a,b){ return b.gbps - a.gbps; });
            return { capacityGbps: peers.reduce(function(s,p){ return s+p.gbps; },0),
                     peers: peers.length, peerList: peers, ports: ports, src:'peeringdb' };
          });
      })
      .catch(function(){ return null; });
  }

  /* ─────────────── source 2 ▸ the 24h curve ──────────────────────── */
  function parseSeries(text){
    var t = text.trim();
    if(t.charAt(0) === '[' || t.charAt(0) === '{'){
      var j = JSON.parse(t), arr = Array.isArray(j) ? j : (j.data || j.series || []);
      return arr.map(function(p){
        if(Array.isArray(p)) return { t:+p[0], v:+p[1] };
        return { t:+(p.t || p.time || p.timestamp), v:+(p.in != null ? p.in : (p.v != null ? p.v : p.value)) };
      }).filter(function(p){ return isFinite(p.t) && isFinite(p.v); });
    }
    return t.split(/\r?\n/).map(function(line){
      var c = line.split(/[,;\t]/); if(c.length < 2) return null;
      var ts = parseFloat(c[0]), v = parseFloat(c[1]);
      return (isFinite(ts) && isFinite(v)) ? { t:ts, v:v } : null;
    }).filter(Boolean);
  }
  function fromLiveFile(lan){
    var L = window.IX_LIVE; if(!L || !lan || !L[lan]) return null;
    var e = L[lan];
    var pts = (e.series||[]).map(function(p){
      return { t:+(p.t || p[0]), v:+(p.v != null ? p.v : (p.in != null ? p.in : p[1])) };
    }).filter(function(p){ return isFinite(p.t) && isFinite(p.v); });
    if(pts.length < 4) return null;
    var unit = (e.unit || 'bps').toLowerCase(), div = unit === 'gbps' ? 1 : (unit === 'mbps' ? 1000 : 1e9);
    var gb = pts.map(function(p){ return { t:p.t, v:p.v/div }; });
    return { series:gb,
             peakGbps: e.peakGbps != null ? e.peakGbps : gb.reduce(function(a,p){ return Math.max(a,p.v); },0),
             currentGbps: e.currentGbps != null ? e.currentGbps : gb[gb.length-1].v, src:'linx portal' };
  }
  function fromTraffic(url){
    if(!url) return Promise.resolve(null);
    return fetch(url, { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(txt){
        var pts = parseSeries(txt); if(pts.length < 4) return null;
        var gb = pts.map(function(p){ return { t:p.t, v:p.v/1e9 }; });
        return { series:gb, peakGbps:gb.reduce(function(a,p){ return Math.max(a,p.v); },0),
                 currentGbps:gb[gb.length-1].v, src:'live traffic' };
      }).catch(function(){ return null; });
  }
  /* a plausible day, scaled to the configured peak; "now" is read off the curve */
  function shapeDay(peak){
    var pts = [], t0 = Math.floor(Date.now()/1000) - 24*3600;
    var d24 = function(a,b){ var x = Math.abs(a-b) % 24; return x > 12 ? 24-x : x; };
    for(var i=0;i<=96;i++){
      var d = new Date((t0 + i*900)*1000), h = d.getHours() + d.getMinutes()/60;
      var s = 0.34 + 0.50*Math.exp(-Math.pow(d24(h,21.5)/4.6,2)) + 0.22*Math.exp(-Math.pow(d24(h,14.0)/3.4,2))
                   - 0.14*Math.exp(-Math.pow(d24(h, 5.0)/2.6,2));
      pts.push({ t:t0 + i*900, v:peak*Math.max(0.12,s)*(0.985 + 0.015*Math.sin(i*2.3)) });
    }
    return pts;
  }

  /* ───────────────────────── the chart ───────────────────────────── */
  function areaChart(series, peak){
    if(!series || series.length < 2) return '';
    var W = 1000, H = 200, PB = 16, t0 = series[0].t, span = (series[series.length-1].t - t0) || 1;
    var top = Math.max(peak,1)*1.18;
    var x = function(p){ return (p.t - t0)/span*W; }, y = function(p){ return H - PB - (p.v/top)*(H-PB); };
    var d = '', a = 'M0,'+(H-PB);
    series.forEach(function(p,i){ var px=x(p).toFixed(1), py=y(p).toFixed(1); d += (i?'L':'M')+px+','+py; a += 'L'+px+','+py; });
    a += 'L'+W+','+(H-PB)+'Z';
    var pk = series.reduce(function(m,p){ return p.v > m.v ? p : m; }, series[0]);
    var pkx = x(pk), pky = y(pk), anchor = pkx > W*0.72 ? 'end' : (pkx < W*0.12 ? 'start' : 'middle');
    var last = series[series.length-1];
    var grid = [1/3,2/3].map(function(f){ var gy=(H-PB-f*(H-PB)).toFixed(1);
      return '<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="rgba(165,78,225,.14)" stroke-width="1"/>'; }).join('');
    var gid = 'g'+Math.random().toString(36).slice(2,8);
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">'
      + '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="#1bced8" stop-opacity=".42"/><stop offset="1" stop-color="#1bced8" stop-opacity="0"/></linearGradient></defs>'
      + grid + '<line x1="0" y1="'+(H-PB)+'" x2="'+W+'" y2="'+(H-PB)+'" stroke="rgba(165,78,225,.30)" stroke-width="1.5"/>'
      + '<path d="'+a+'" fill="url(#'+gid+')"/>'
      + '<path d="'+d+'" fill="none" stroke="#1bced8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
      + '<circle cx="'+pkx.toFixed(1)+'" cy="'+pky.toFixed(1)+'" r="4.5" fill="#0a0313" stroke="#a54ee1" stroke-width="2.5"/>'
      + '<text x="'+pkx.toFixed(1)+'" y="'+Math.max(14,pky-14).toFixed(1)+'" text-anchor="'+anchor+'" font-family="IBM Plex Mono, monospace" font-size="15" fill="#d3cae6">PEAK '+gLabel(pk.v)+'</text>'
      + '<circle cx="'+x(last).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="5" fill="#1bced8"/></svg>';
  }
  function chartBlock(d){
    return '<div class="ct"><span class="lab">Traffic · last 24 hours</span><em>Now <b>'+gLabel(d.currentGbps)+'</b></em></div>'
      + areaChart(d.series, d.peakGbps)
      + '<div class="xlab"><span>'+(d.series?hhmm(d.series[0].t):'')+'</span>'
      + '<span>'+(d.series?hhmm(d.series[Math.floor(d.series.length/2)].t):'')+'</span>'
      + '<span>'+(d.series?hhmm(d.series[d.series.length-1].t):'')+'</span></div>';
  }

  /* ───────────────────────── OVERVIEW ────────────────────────────── */
  var LIVE = [];
  function card(ix, d, idx){
    var peers = (d.peerList||[]).slice(0, CFG.peersShown), maxG = peers.length ? peers[0].gbps : 1;
    return '<div class="card ixcard" data-ix="'+idx+'">'
      + '<div class="ixtop"><div><div class="ixname">'+esc(ix.name)+'</div><div class="ixsite">'+esc(ix.site)+'</div></div>'
      +   '<div><div class="ixcode">'+esc(ix.code)+'</div><div class="hint"><span>Explore peers</span><i>›</i></div></div></div>'
      + '<div class="ixkpis">'
      +   '<div class="ixkpi"><div class="lab">Connected capacity</div><div class="v">'+tbps(d.capacityGbps)+'<small>'+tbpsUnit(d.capacityGbps)+'</small></div></div>'
      +   '<div class="ixkpi"><div class="lab">Connected peers</div><div class="v">'+(d.peers != null ? d.peers : '—')+'</div></div>'
      + '</div>'
      + '<div class="ixchart">'+chartBlock(d)+'</div>'
      + '<div class="ixpeers"><div class="lab">Largest connected peers</div>'
      +   peers.map(function(p){
            return '<div class="ixpeer">'+mark(p)
              + '<div class="n">'+esc(p.name)+'<small>AS'+p.asn+'</small></div>'
              + '<div class="g"><b>'+(p.gbps>=1000?(p.gbps/1000).toFixed(1):p.gbps.toFixed(0))+'</b> '+(p.gbps>=1000?'Tbps':'Gbps')+'</div>'
              + '<div class="ixbar"><i style="width:'+Math.max(4,(p.gbps/maxG)*100).toFixed(1)+'%"></i></div></div>';
          }).join('')
      + '</div>'
      + '</div>';
  }
  function paint(){
    var g = $('ixGrid');
    g.innerHTML = CFG.exchanges.map(function(ix,i){ return card(ix, LIVE[i]||{}, i); }).join('');
    hydrate(g);
    var capT = LIVE.reduce(function(a,d){ return a + (d && d.capacityGbps || 0); },0);
    var pT   = LIVE.reduce(function(a,d){ return a + (d && d.peers || 0); },0);
    var pkT  = LIVE.reduce(function(a,d){ return a + (d && d.peakGbps || 0); },0);
    $('ixTotals').innerHTML =
        '<div class="ixtot">Total capacity <b>'+tbps(capT)+'</b><i>'+tbpsUnit(capT)+'</i></div>'
      + '<div class="ixtot">Connected peers <b>'+pT+'</b></div>'
      + '<div class="ixtot">Combined 24h peak <b>'+tbps(pkT)+'</b><i>'+tbpsUnit(pkT)+'</i></div>'
      + '<div class="ixtot">Exchanges <b>'+CFG.exchanges.length+'</b></div>';
    if(open != null) renderExplorer(open);       // keep the explorer current on refresh
  }

  function load(){
    var srcs = [];
    Promise.all(CFG.exchanges.map(function(ix){
      var live = fromLiveFile(ix.lan);
      return Promise.all([ fromPeeringDB(ix.peeringdbIxId), live ? Promise.resolve(live) : fromTraffic(ix.trafficUrl) ])
        .then(function(r){
          var pdb = r[0], tr = r[1], m = ix.manual || {};
          if(pdb) srcs.push('peeringdb');
          if(tr)  srcs.push(tr.src);
          var peakGbps = tr ? tr.peakGbps : m.peakGbps;
          var series   = tr ? tr.series : shapeDay(peakGbps || 1);
          var peerList = pdb ? pdb.peerList
                             : (m.peers_list || m.topPeers || []).map(describe).sort(function(a,b){ return b.gbps-a.gbps; });
          return { capacityGbps: pdb ? pdb.capacityGbps : m.capacityGbps,
                   peers:        pdb ? pdb.peers        : (m.peers != null ? m.peers : peerList.length),
                   peerList: peerList, ports: pdb ? pdb.ports : guessPorts(peerList), peakGbps: peakGbps,
                   currentGbps: tr ? tr.currentGbps : series[series.length-1].v, series: series };
        });
    })).then(function(all){
      LIVE = all; paint();
      var uniq = srcs.filter(function(v,i,a){ return a.indexOf(v)===i; });
      var line = uniq.length ? 'Source · '+uniq.join(' + ')+' · updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})
                             : 'Source · configured values';
      $('ixSrc').textContent = line; $('exSrc').textContent = line;
    });
  }

  /* ─────────────────────── PEER EXPLORER ─────────────────────────── */
  var open = null, idleT = null, tickT = null, left = 0;

  function renderExplorer(idx){
    var ix = CFG.exchanges[idx], d = LIVE[idx] || {}, all = d.peerList || [];
    $('exName').textContent = ix.name; $('exSite').textContent = ix.site; $('exCode').textContent = ix.code;
    $('exKpis').innerHTML =
        '<div class="card exkpi"><span class="lab">Capacity</span><div class="v">'+tbps(d.capacityGbps)+'<small>'+tbpsUnit(d.capacityGbps)+'</small></div></div>'
      + '<div class="card exkpi"><span class="lab">Peers</span><div class="v">'+(d.peers != null ? d.peers : all.length)+'</div></div>'
      + '<div class="card exkpi"><span class="lab">24h peak</span><div class="v">'+tbps(d.peakGbps)+'<small>'+tbpsUnit(d.peakGbps)+'</small></div></div>'
      + '<div class="card exkpi"><span class="lab">Now</span><div class="v">'+tbps(d.currentGbps)+'<small>'+tbpsUnit(d.currentGbps)+'</small></div></div>';
    $('exChart').innerHTML = chartBlock(d);

    /* the marquee: featured networks that are actually here, largest first */
    var feat = all.filter(function(p){ return p.featured; }).slice(0, CFG.featuredShown);
    $('exFeat').innerHTML = '<div class="lab"><span>Marquee networks connected here</span><span>'+feat.length+' of '+all.length+' peers</span></div>'
      + '<div class="tiles" style="--n:'+Math.max(feat.length,1)+'">'
      + (feat.length ? feat.map(function(p,i){
          return '<div class="tile anim" style="animation-delay:'+(i*45)+'ms">'+mark(p)
            + '<div class="n">'+esc(p.name)+'</div><div class="a">AS'+p.asn+'</div>'
            + '<div class="p">'+portLabel(p.gbps)+'</div></div>';
        }).join('') : '<div class="tile"><div class="n" style="color:var(--dimmer)">No marquee networks listed</div></div>')
      + '</div>';

    /* everyone, by kind of network */
    var groups = { content:[], carrier:[], isp:[], other:[] };
    all.forEach(function(p){ (groups[p.type] || groups.other).push(p); });
    var perRow = 7, cap = perRow*3;         // three rows per group, then "+ n more"
    $('exAll').innerHTML = '<div class="lab"><span>All connected peers</span><span>By port capacity</span></div>'
      + '<div class="groups">' + ['content','carrier','isp','other'].filter(function(k){ return groups[k].length; }).map(function(k){
          var list = groups[k], shown = list.slice(0, list.length > cap ? cap-1 : cap), more = list.length - shown.length;
          return '<div class="group '+k+'"><div class="gh"><i></i>'+TYPE_NAME[k]+'<b>'+list.length+'</b></div><div class="chips">'
            + shown.map(function(p){ return '<div class="chip">'+mark(p)+'<div class="n">'+esc(p.name)+'<small>AS'+p.asn+'</small></div>'
                + '<div class="p">'+gLabel(p.gbps)+'</div></div>'; }).join('')
            + (more > 0 ? '<div class="chip more">+ '+more+' more</div>' : '')
            + '</div></div>';
        }).join('') + '</div>';

    /* mix by type — a magnitude, so bars */
    var tot = Math.max(1, all.length);
    $('exMix').innerHTML = '<div class="lab">Peers by network type</div>'
      + ['content','carrier','isp','other'].map(function(k){
          var n = groups[k].length, cap = groups[k].reduce(function(s,p){ return s+p.gbps; },0);
          return '<div class="row '+k+'"><span class="k">'+TYPE_NAME[k]+'</span><span class="v">'+n+'<small>'+gLabel(cap)+'</small></span>'
            + '<div class="bar"><i data-w="'+Math.round(n/tot*100)+'"></i></div></div>';
        }).join('')
      + portsBlock(d.ports || []);
    requestAnimationFrame(function(){ $('exMix').querySelectorAll('.bar i').forEach(function(el){ el.style.width = el.dataset.w+'%'; }); });

    hydrate($('explorer'));
  }

  function portsBlock(ports){
    var c = {}; ports.forEach(function(g){ c[g] = (c[g]||0) + 1; });
    var sizes = Object.keys(c).map(Number).sort(function(a,b){ return b-a; });
    if(!sizes.length) return '';
    return '<div class="ports"><div class="lab">Member ports · '+ports.length+'</div><div class="pills">'
      + sizes.map(function(g){ return '<div class="pill"><b>'+c[g]+'</b><span>× '+(g>=1000?(g/1000)+'T':g+'G')+'</span></div>'; }).join('')
      + '</div></div>';
  }

  function showExplorer(idx){
    if(idx == null || !CFG.exchanges[idx]) return;
    open = idx; renderExplorer(idx);
    $('overview').classList.add('dim');
    var ex = $('explorer'); ex.classList.add('open');
    requestAnimationFrame(function(){ ex.classList.add('on'); });
    armIdle();
  }
  function hideExplorer(){
    if(open == null) return;
    open = null; clearTimeout(idleT); clearInterval(tickT);
    var ex = $('explorer'); ex.classList.remove('on');
    $('overview').classList.remove('dim');
    setTimeout(function(){ if(open == null) ex.classList.remove('open'); }, 460);
  }
  function armIdle(){
    clearTimeout(idleT); clearInterval(tickT);
    var total = CFG.explorerSeconds|0, bar = $('exTimer');
    if(total <= 0){ bar.style.display = 'none'; return; }
    bar.style.display = ''; left = total;
    var fill = bar.querySelector('b'); fill.style.transition = 'none'; fill.style.width = '100%';
    void fill.offsetWidth; fill.style.transition = 'width 1s linear';
    tickT = setInterval(function(){ left--; fill.style.width = Math.max(0,left/total*100)+'%'; }, 1000);
    idleT = setTimeout(hideExplorer, total*1000);
  }

  /* ───────────────────────── input ───────────────────────────────── */
  $('ixGrid').addEventListener('click', function(e){
    var c = e.target.closest('.ixcard'); if(c) showExplorer(+c.dataset.ix);
  });
  $('explorer').addEventListener('click', function(){ hideExplorer(); });
  addEventListener('keydown', function(e){
    if(e.key === 'Escape' || e.key === '0' || e.key === 'Backspace'){ hideExplorer(); return; }
    var n = parseInt(e.key,10);
    if(n >= 1 && n <= CFG.exchanges.length){ e.preventDefault(); showExplorer(n-1); return; }
    if(open != null && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){
      e.preventDefault(); showExplorer((open + (e.key === 'ArrowRight' ? 1 : -1) + CFG.exchanges.length) % CFG.exchanges.length);
    }
  });
  /* the control tablet can open an exchange too: 0 = overview, 1..3 = explorer */
  window.__setView = function(n){ n = n|0; if(n <= 0) hideExplorer(); else showExplorer(n-1); };

  load();
  setInterval(load, Math.max(1, CFG.refreshMinutes) * 60000);
})();
</script>
</body>
</html>
