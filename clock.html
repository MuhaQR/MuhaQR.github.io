<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Clock</title>
  <style>
    /* 1) Force the exact size & background */
    html, body {
      width: 500px;
      height: 120px;
      margin: 0;
      padding: 0;
      background: #3A1066;
      overflow: hidden;
    }

    /* 2) Your custom font */
    @font-face {
      font-family: 'STCForwardBold';
      src: url('https://cdn.jsdelivr.net/gh/MuhaQR/MuhaQR.github.io@main/STCForward-Bold.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* 3) Clock styling */
    #clock {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'STCForwardBold', sans-serif;
      font-size: 2.5em;      /* tweak as needed to fit */
      color: #ffffff;
      text-shadow: 0 0 8px rgba(0,0,0,0.7);
      padding: 0 10px;       /* optional horizontal padding */
    }
  </style>
</head>
<body>
  <div id="clock">Loading…</div>
  <script>
    function updateClock() {
      const now = new Date();
      const date = now.toLocaleDateString('en-GB', {
        day:   '2-digit',
        month: 'short',
        year:  'numeric'
      });
      const time = now.toLocaleTimeString('en-GB', {
        hour:   '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      document.getElementById('clock').textContent = `${date} ${time}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
