<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Clock with Custom Font</title>
  <style>
    /* 1. Load your GitHub‐hosted font via RawGit/RawGitHub */
    @font-face {
      font-family: 'STCForwardBold';
      src: url('https://raw.githubusercontent.com/MuhaQR/MuhaQR.github.io/main/STCForward-Bold.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* 2. Basic styling */
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
    #clock {
      font-family: 'STCForwardBold', sans-serif;
      font-size: 3em;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(0,0,0,0.7);
      padding: 0.5em;
    }
  </style>
</head>
<body>
  <div id="clock">Loading…</div>

  <script>
    function updateClock() {
      const now = new Date();
      const date = now.toLocaleDateString('en-GB', {
        day:   '2-digit',
        month: 'short',
        year:  'numeric'
      });
      const time = now.toLocaleTimeString('en-GB', {
        hour:   '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('clock').textContent = `${date} ${time}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
