<script>
const CONFIG = {

  /* ══ 1 ▸ HEADLINE CHIPS  ← the small pills under the title ══════
        Free text — edit, add or remove lines as you like.
        The date is the GOC start date, not the visit date.          */
  chips: [
    "Established  ·  01 Jan 2025",
    "ISO 11064",
    "Empowered / Neutral"
  ],

  /* ══ 2 ▸ HEADINGS ═══════════════════════════════════════════════ */
  kicker:    "Welcome to",
  title:     "Global Operations Center",
  numTitle:  "Key Numbers",
  numSub:    "",                       // "" = no line under the Key Numbers title
  footRight: "24 / 7 / 365 Monitoring &nbsp;·&nbsp; Riyadh, Kingdom of Saudi Arabia",

  /* ══ 3 ▸ CAPABILITIES  ← the six pillars along the bottom ═══════
        icon: command | innov | globe | uptime | coe | resil          */
  features: [
    { icon:"command", title:"Central Command",      items:["Data Centers","Global Enterprise Services","Global Infrastructure"] },
    { icon:"innov",   title:"Innovation Hub",       items:["Real Time Automation","Fully Integrated","T2R Journey","Efficiency"] },
    { icon:"globe",   title:"Compliant",            items:["ISO 9001 · 20000 · 27001 · 27701","ISO 22301 · 10002","PCI-DSS · SOC I, II, III"] },
    { icon:"uptime",  title:"Committed to Uptime",  items:["Value Chain SLAs","Supply Chain SLAs","OLAs / WLAs"] },
    { icon:"coe",     title:"Center of Excellence", items:["ITIL · Best Practices","Core Expertise / NOCaaS","Operating Procedures"] },
    { icon:"resil",   title:"Resilience",           items:["Business Continuity","Disaster Recovery","Cyber Security"] }
  ],

  /* ══ 4 ▸ OUR SITES  ← the three points that light up ═════════════
        key must stay as-is (it places the dot on the map);
        label and sub are free text                                  */
  sites: [
    /* dx / dy nudge the label away from its dot, in pixels */
    { key:"Riyadh", label:"Riyadh", sub:"Data Center · GOC",             ix:"RYD IX", dx: -40, dy:  86 },
    { key:"Jeddah", label:"Jeddah", sub:"Data Center · Landing Station", ix:"JED IX", dx:-330, dy:  26 },
    { key:"Dammam", label:"Dammam", sub:"Data Center",                   ix:"DMM IX", dx: 240, dy:-146 }
  ],

  /* ══ 5 ▸ KEY NUMBERS  ← the second view ═════════════════════════
        Grouped into columns, exactly like your KPI dashboard.
        Every card:  label   = the metric name
                     prefix  = ">" or ""            (optional)
                     value   = the figure, as text  ("Zero" and "4:23" are fine)
                     unit    = "%", "Tbps", "min", "MW" …   (optional)
                     target  = the small grey reference line  (optional)
                     note    = a second small line             (optional)
                     bar     = { v: 70, max: 128 }  draws a fill bar (optional)   */
  groups: [
    { title:"Reliability & Efficiency", items:[
      { label:"Availability (Power)",        value:"100",  unit:"%", target:"99.999%  →  100%" },
      { label:"Availability (Cooling)",      value:"100",  unit:"%", target:"99.999%  →  100%" },
      { label:"DC Outages",                  value:"0",    unit:"",  target:"0  →  0" }
    ]},
    { title:"Maintenance Excellence", items:[
      { label:"PMR Completion Rate",         value:"98",   unit:"%", target:"90%  →  95%" },
      { label:"Spare Part Availability",     value:"99",   unit:"%", target:"95%  →  100%" }
    ]},
    { title:"Safety & Security", items:[
      { label:"Unauthorized Access Rate",    value:"Zero", unit:"",  target:"0  →  0" },
      { label:"Safe Man-Hours (Zero LTI)",   value:"Zero", unit:"",  target:"0  →  0" },
      { label:"Drills Completion Rate",      value:"100",  unit:"%", target:"95%  →  100%" }
    ]},
    { title:"Customer Excellence", items:[
      { label:"Customer Response Time",      value:"4:23", unit:"min",
        target:"5 / 10 / 15 / 60 min by severity", note:"12,083 customer tickets" },
      { label:"Customer Audits Compliance",  value:"100",  unit:"%", target:"95%  →  100%" }
    ]},
    { title:"Connectivity & Capacity", items:[
      { label:"Internet Exchange Capacity",  value:"40.1", unit:"Tbps", target:"Across 3 Internet Exchanges" },
      { label:"Submarine Cable Availability",value:"99.97",unit:"%",    target:"95.5%  →  100%" },
      { label:"Sub-Sea Capacity",            value:"70",   unit:"Tbps",
        target:"of 128 Tbps available", bar:{ v:70, max:128 } }
    ]}
  ],

  /* ══ 6 ▸ BEHAVIOUR ══════════════════════════════════════════════ */
  autoRotate:        false,   // true = swap views by itself
  autoRotateSeconds: 30,
  arcSeconds:        7        // how long one light pulse takes to cross an arc
};

<style>
  :root{
    --ink:#0a0313; --panel-b:rgba(165,78,225,.22);
    --sea:#1bced8; --coral:#ff375e; --moon:#a54ee1;
    --text:#f2ecf7; --dim:#d3cae6; --dimmer:#ab9fca;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:15840px;height:1450px;overflow:hidden;}
  body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;
       -webkit-font-smoothing:antialiased;cursor:none;}
  .stage{position:relative;width:15840px;height:1450px;overflow:hidden;
    background:
      radial-gradient(6200px 1500px at 50% 66%, #2c0c50 0%, #1a0630 52%, #0a0313 100%);}

  #map{position:absolute;inset:0;z-index:1;width:15840px;height:1450px;
       transition:opacity .6s ease, filter .6s ease;
       -webkit-mask-image:linear-gradient(to right, transparent 3870px, #000 4980px,
                                          #000 10860px, transparent 11970px);
       mask-image:linear-gradient(to right, transparent 3870px, #000 4980px,
                                  #000 10860px, transparent 11970px);}
  .scrim{position:absolute;left:0;right:0;top:0;height:700px;z-index:3;pointer-events:none;
    background:linear-gradient(180deg, rgba(10,3,19,.90) 0%, rgba(10,3,19,.62) 45%, rgba(10,3,19,0) 100%);}
  .vig{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:
      radial-gradient(2600px 1500px at 12% 50%, rgba(165,78,225,.13), transparent 70%),
      radial-gradient(2600px 1500px at 88% 50%, rgba(165,78,225,.13), transparent 70%),
      radial-gradient(9000px 1500px at 50% 50%, transparent 48%, rgba(10,3,19,.72) 100%);}
  .wingfx{position:absolute;inset:0;z-index:2;pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(165,78,225,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(165,78,225,.05) 1px, transparent 1px);
    background-size:90px 90px;
    -webkit-mask-image:linear-gradient(to right,#000 0,#000 3400px,transparent 4600px,
                       transparent 11240px,#000 12440px,#000 100%);
    mask-image:linear-gradient(to right,#000 0,#000 3400px,transparent 4600px,
               transparent 11240px,#000 12440px,#000 100%);
    animation:wdrift 60s ease-in-out infinite alternate;}
  @keyframes wdrift{0%{opacity:.75;transform:translateX(0)}100%{opacity:1;transform:translateX(26px)}}
  .winglogo{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:7;opacity:.92;}
  .winglogo img{height:118px;display:block;}

  /* site labels */
  .sitelab{position:absolute;z-index:6;transform:translate(-50%,0);text-align:center;white-space:nowrap;
    opacity:0;animation:fadein .8s forwards;}
  .sitelab .n{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#fff;
    text-shadow:0 2px 22px rgba(10,3,19,.95);}
  .sitelab .s{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);margin-top:5px;text-shadow:0 2px 18px rgba(10,3,19,.95);}
  .sitelab .ix{display:inline-block;margin-top:9px;padding:6px 15px;border-radius:8px;
    border:1px solid rgba(27,206,216,.55);background:rgba(27,206,216,.13);
    font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.16em;
    color:#7fe6ee;text-shadow:none;}

  /* chrome */
  .topbar{position:absolute;left:64px;top:46px;z-index:8;}
  .topbar img{height:54px;display:block;}
  .footer{position:absolute;left:50%;transform:translateX(-50%);width:3728px;bottom:36px;z-index:8;display:flex;
    align-items:center;justify-content:space-between;height:32px;
    font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dimmer);}
  .hint{display:flex;align-items:center;gap:10px;opacity:.75;}
  .hint kbd{font-family:'Inter',Arial,sans-serif;font-size:17px;line-height:1;padding:5px 10px;
    border-radius:7px;border:1px solid rgba(165,78,225,.34);background:rgba(10,3,19,.45);color:var(--dim);}
  .dots{display:flex;gap:13px;}
  .dots span{width:12px;height:12px;border-radius:50%;background:rgba(165,78,225,.28);
    border:1px solid rgba(165,78,225,.45);transition:background .3s,box-shadow .3s;}
  .dots span.on{background:var(--coral);border-color:var(--coral);box-shadow:0 0 14px rgba(255,55,94,.75);}
  .footer .right{display:flex;align-items:center;gap:12px;}
  .footer .led{width:9px;height:9px;border-radius:50%;background:var(--sea);
    box-shadow:0 0 12px rgba(27,206,216,.8);}

  /* views */
  .view{position:absolute;inset:0;z-index:5;opacity:0;visibility:hidden;transition:opacity .55s ease;}
  .view.on{opacity:1;visibility:visible;}
  @keyframes rise{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:none;}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  .greet{position:absolute;left:50%;top:104px;transform:translateX(-50%);text-align:center;width:3400px;}
  .greet .kick{font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:.58em;
    text-transform:uppercase;color:var(--coral);margin-bottom:20px;}
  .greet h1{font-family:'Space Grotesk',sans-serif;font-size:116px;font-weight:600;line-height:1.02;
    color:#fff;text-shadow:0 0 80px rgba(165,78,225,.75), 0 6px 40px rgba(10,3,19,.95);}
  .greet .rule{width:560px;height:2px;margin:26px auto 22px;
    background:linear-gradient(90deg,transparent,rgba(255,55,94,.85) 22%,var(--coral) 50%,rgba(255,55,94,.85) 78%,transparent);}
  .chips{display:flex;justify-content:center;gap:22px;margin-top:4px;}
  .chip{padding:13px 30px;border-radius:999px;border:1px solid rgba(165,78,225,.30);
    background:rgba(10,3,19,.60);backdrop-filter:blur(8px);
    font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.10em;color:var(--dim);}

  /* capability strip along the bottom of view 1 */
  .pillars{position:absolute;left:50%;transform:translateX(-50%);width:3728px;
    bottom:104px;height:330px;display:flex;gap:18px;}
  .pillar{flex:1 1 0;min-width:0;position:relative;overflow:hidden;
    border:1px solid rgba(165,78,225,.26);border-radius:20px;
    background:rgba(10,3,19,.60);backdrop-filter:blur(12px) saturate(1.15);
    box-shadow:0 18px 44px rgba(0,0,0,.5);
    padding:24px 26px;display:flex;flex-direction:column;gap:16px;}
  .pillar::before{content:"";position:absolute;left:26px;right:26px;top:0;height:2px;
    background:linear-gradient(90deg,rgba(255,55,94,.75),rgba(255,55,94,0));}
  .pillar .ph{display:flex;align-items:center;gap:16px;}
  .pillar .ic{width:60px;height:60px;flex:0 0 auto;display:grid;place-items:center;border-radius:15px;
    border:1px solid rgba(255,55,94,.28);background:rgba(255,55,94,.09);}
  .pillar .ic svg{width:34px;height:34px;stroke:var(--coral);fill:none;stroke-width:2.1;
    stroke-linecap:round;stroke-linejoin:round;}
  .pillar h3{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#fff;line-height:1.12;}
  .pillar ul{list-style:none;display:flex;flex-direction:column;gap:11px;}
  .pillar li{display:flex;align-items:flex-start;gap:11px;font-size:21px;line-height:1.3;color:var(--dim);}
  .pillar li i{width:10px;height:10px;flex:0 0 auto;margin-top:7px;background:var(--coral);border-radius:2px;}

  /* view 2 */
  .numhead{position:absolute;left:50%;top:92px;transform:translateX(-50%);text-align:center;}
  .numhead h1{font-family:'Space Grotesk',sans-serif;font-size:78px;font-weight:600;color:#fff;
    text-shadow:0 0 70px rgba(165,78,225,.6);}
  .numhead .sub{font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--dim);margin-top:12px;}
  .groups{position:absolute;left:50%;transform:translateX(-50%);width:3728px;
    top:292px;bottom:118px;display:flex;gap:22px;}
  .col{flex:1 1 0;display:flex;flex-direction:column;gap:15px;min-width:0;}
  .cat{font-family:'IBM Plex Mono',monospace;font-size:23px;letter-spacing:.17em;
       text-transform:uppercase;color:var(--moon);padding-left:8px;flex:0 0 auto;}
  .kcard{flex:1 1 0;position:relative;overflow:hidden;min-height:0;
    border:1px solid rgba(165,78,225,.26);border-radius:20px;
    background:rgba(10,3,19,.56);backdrop-filter:blur(12px) saturate(1.15);
    box-shadow:0 18px 44px rgba(0,0,0,.45);
    display:flex;flex-direction:column;justify-content:center;gap:12px;padding:22px 30px;}
  .kcard::before{content:"";position:absolute;left:30px;right:30px;top:0;height:2px;
    background:linear-gradient(90deg,rgba(255,55,94,.75),rgba(255,55,94,0));}
  .kcard .lab{font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:600;
    color:#fff;line-height:1.15;}
  .kcard .val{display:flex;align-items:baseline;gap:9px;line-height:1;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:74px;color:#fff;
    text-shadow:0 0 44px rgba(165,78,225,.5);}
  .kcard .val .pre{font-size:40px;font-weight:500;color:var(--coral);}
  .kcard .val small{font-size:31px;font-weight:500;color:var(--sea);}
  .kcard .tgt{font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.06em;
    color:var(--dimmer);}
  .kcard .note{font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.06em;
    color:var(--dim);}
  .kcard .bar{height:11px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;}
  .kcard .bar i{display:block;height:100%;border-radius:6px;
    background:linear-gradient(90deg,#1bced8,#8f4fd6);
    width:0;transition:width 1.2s cubic-bezier(.25,.8,.35,1);}
</style>
</head>

10957.5\" y2=\"1450\" stroke=\"rgba(165,78,225,.07)\" stroke-width=\"1.4\"/><line x1=\"3870.0\" y1=\"1310.0\" x2=\"11970.0\" y2=\"1310.0\" stroke=\"rgba(165,78,225,.07)\" stroke-width=\"1.4\"/><line x1=\"3870.0\" y1=\"972.5\" x2=\"11970.0\" y2=\"972.5\" stroke=\"rgba(165,78,225,.07)\" stroke-width=\"1.4\"/><line x1=\"3870.0\" y1=\"635.0\" x2=\"11970.0\" y2=\"635.0\" stroke=\"rgba(165,78,225,.07)\" stroke-width=\"1.4\"/><line x1=\"3870.0\" y1=\"297.5\" x2=\"11970.0\" y2=\"297.5\" stroke=\"rgba(165,78,225,.07)\" stroke-width=\"1.4\"/>", "cities": {"Riyadh": [7958.7, 754.5], "Jeddah": [7788.8, 826.5], "Dammam": [8034.8, 715.3]}, "reach": {"Marseille": [7028.3, 335.8], "London": [6904.6, 151.0], "Istanbul": [7559.5, 387.3], "Cairo": [7610.4, 634.1], "Djibouti": [7878.4, 1049.2], "Nairobi": [7735.9, 1339.0], "Karachi": [8415.0, 750.6], "Mumbai": [8547.3, 880.7], "Singapore": [9243.5, 1279.6]}};
</script>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg', $=function(i){return document.getElementById(i);};

  /* ── text ── */
  $('footRight').innerHTML = CONFIG.footRight;
  $('gKick').textContent   = CONFIG.kicker;
  $('gTitle').textContent  = CONFIG.title;
  $('gChips').innerHTML = CONFIG.chips.map(function(c){
      return '<div class="chip">'+c+'</div>'; }).join('');

  var ICONS = {
    command:'<rect x="2" y="2.5" width="5.4" height="4.6" rx="1"/><rect x="9.3" y="2.5" width="5.4" height="4.6" rx="1"/><rect x="16.6" y="2.5" width="5.4" height="4.6" rx="1"/><path d="M4.7 7.1v3.1h14.6V7.1M12 7.1v3.1M12 10.2v7.4M12 21l-3-3.4h6L12 21z"/>',
    innov:'<rect x="3" y="2.5" width="18" height="14" rx="2"/><path d="M6 13.5l3.6-4.2 2.6 2.9 2.3-2.6 3.5 3.9"/><circle cx="7.5" cy="19.5" r="3.2"/><path d="M7.5 17.9v1.6l1.1.9"/>',
    globe:'<circle cx="12" cy="12" r="9.4"/><path d="M12 2.6c-3 3-3 15.8 0 18.8M12 2.6c3 3 3 15.8 0 18.8M2.9 8.4h18.2M2.9 15.6h18.2"/>',
    uptime:'<circle cx="12" cy="13.4" r="8.3"/><path d="M9.4 2.2h5.2M12 2.2v2.9M18.6 6.8l1.7-1.7M12 13.4l3.4-3.4"/>',
    coe:'<path d="M5 2.6h9.2L19 7.3v14.1H5z"/><path d="M14 2.6v4.9h5"/><circle cx="12" cy="13.6" r="2.9"/><path d="M10.3 16.1 9.4 20l2.6-1.4 2.6 1.4-.9-3.9"/>',
    resil:'<path d="M10 3.4c1.6 3 1.6 14.2 0 17.2M14 3.4c-1.6 3-1.6 14.2 0 17.2"/><path d="M1.6 12h5.6M5.2 9.6 7.6 12l-2.4 2.4M22.4 12h-5.6M18.8 9.6 16.4 12l2.4 2.4"/>'
  };
  $('pillars').innerHTML = CONFIG.features.map(function(f,i){
    return '<div class="pillar" data-anim style="animation:rise .9s '+(0.55+i*0.09)+'s both">'+
      '<div class="ph"><div class="ic"><svg viewBox="0 0 24 24">'+(ICONS[f.icon]||ICONS.globe)+'</svg></div>'+
      '<h3>'+f.title+'</h3></div>'+
      '<ul>'+f.items.map(function(t){ return '<li><i></i><span>'+t+'</span></li>'; }).join('')+'</ul></div>';
  }).join('');
  $('nTitle').textContent  = CONFIG.numTitle;
  if(CONFIG.numSub){ $('nSub').innerHTML = CONFIG.numSub; } else { $('nSub').style.display='none'; }

  /* ── graticule ── */
  $('grat').innerHTML = MAP.grat || '';

  /* ── land ── */
  $('land').innerHTML = MAP.land.map(function(d){ return '<path d="'+d+'"/>'; }).join('');
  $('home').innerHTML = MAP.home.map(function(d){ return '<path d="'+d+'"/>'; }).join('');

  /* ── arcs: our sites → the wider region ── */
  var ROUTES = [
    ['Jeddah','London'], ['Jeddah','Marseille'], ['Jeddah','Cairo'],
    ['Jeddah','Djibouti'], ['Jeddah','Nairobi'],
    ['Riyadh','Istanbul'], ['Riyadh','Karachi'],
    ['Dammam','Mumbai'],  ['Dammam','Singapore']
  ];
  var arcsG=$('arcs'), pulsesG=$('pulses'), arcs=[];
  ROUTES.forEach(function(r,i){
    var a=MAP.cities[r[0]], c=MAP.reach[r[1]];
    if(!a||!c) return;
    var mx=(a[0]+c[0])/2, my=(a[1]+c[1])/2, dx=c[0]-a[0], dy=c[1]-a[1];
    var k=0.17;                                   // bow
    var c1=[mx-dy*k, my+dx*k], c2=[mx+dy*k, my-dx*k];
    var cc=(c1[1]<c2[1])?c1:c2;                   // whichever bows upward
    var cx=cc[0], cy=Math.max(150, cc[1]);        // keep the apex on screen
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d','M'+a[0]+','+a[1]+' Q'+cx.toFixed(1)+','+cy.toFixed(1)+' '+c[0]+','+c[1]);
    p.setAttribute('fill','none');
    p.setAttribute('stroke','rgba(190,140,245,.55)');
    p.setAttribute('stroke-width','2.6');
    p.setAttribute('stroke-linecap','round');
    arcsG.appendChild(p);
    var L=p.getTotalLength();
    p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
    p.style.transition='stroke-dashoffset 2.2s cubic-bezier(.25,.8,.35,1)';
    setTimeout(function(){ p.style.strokeDashoffset=0; }, 1100 + i*170);
    // comet
    var dots=[];
    for(var k2=0;k2<7;k2++){
      var c2=document.createElementNS(NS,'circle');
      var f=1-k2/7;
      c2.setAttribute('r',(2.5+7*f).toFixed(1));
      c2.setAttribute('fill', k2===0?'#eaffff':'#1bced8');
      c2.setAttribute('opacity',(0.85*Math.pow(f,1.6)).toFixed(3));
      pulsesG.appendChild(c2); dots.push(c2);
    }
    arcs.push({ path:p, len:L, dots:dots, off:i/ROUTES.length });
  });

  /* ── our three sites ── */
  var sitesG=$('sites'), labs=$('siteLabels'), sHTML='';
  CONFIG.sites.forEach(function(s,i){
    var p=MAP.cities[s.key]; if(!p) return;
    var d=(i*0.7).toFixed(1);
    sHTML +=
      '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="10" fill="#ff375e">'+
        '<animate attributeName="opacity" values="0;1" dur="0.5s" begin="'+d+'s" fill="freeze"/></circle>'+
      '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="10" fill="none" stroke="#ff375e" stroke-width="3" opacity="0">'+
        '<animate attributeName="r" values="10;74" dur="3.2s" begin="'+d+'s" repeatCount="indefinite"/>'+
        '<animate attributeName="opacity" values="0.85;0" dur="3.2s" begin="'+d+'s" repeatCount="indefinite"/></circle>'+
      '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="34" fill="#ff375e" opacity="0">'+
        '<animate attributeName="opacity" values="0;.16" dur="0.8s" begin="'+d+'s" fill="freeze"/></circle>';
    var lx = p[0] + (s.dx||0), ly = p[1] + (s.dy||40);
    sHTML += '<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+lx+'" y2="'+(ly + (s.dy<0?52:-14))+
             '" stroke="rgba(255,55,94,.45)" stroke-width="2" stroke-dasharray="5 7" opacity="0">'+
             '<animate attributeName="opacity" values="0;1" dur="0.6s" begin="'+(0.4+i*0.7)+'s" fill="freeze"/></line>';
    labs.insertAdjacentHTML('beforeend',
      '<div class="sitelab" style="left:'+lx+'px;top:'+ly+'px;animation-delay:'+(0.4+i*0.7)+'s">'+
        '<div class="n">'+s.label+'</div><div class="s">'+s.sub+'</div>'+
        (s.ix?'<div class="ix">'+s.ix+'</div>':'')+'</div>');
  });
  sitesG.innerHTML = sHTML;

  /* ── pulses along the arcs ── */
  function frame(t){
    var period=(CONFIG.arcSeconds||7)*1000;
    arcs.forEach(function(a){
      var base=((t/period)+a.off)%1;
      for(var i=0;i<a.dots.length;i++){
        var f=base-i*0.012; if(f<0) f+=1;
        var pt=a.path.getPointAtLength(f*a.len);
        a.dots[i].setAttribute('cx',pt.x); a.dots[i].setAttribute('cy',pt.y);
      }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ── count-up ── */
  function countUp(el,text,ms){
    var raw=String(text).replace(/,/g,'');
    if(!/^\d+(\.\d+)?$/.test(raw)){ el.textContent=text; return; }
    var target=parseFloat(raw), dec=(raw.split('.')[1]||'').length, t0=performance.now();
    (function step(t){
      var p=Math.min(1,(t-t0)/(ms||1200)), e=1-Math.pow(1-p,3), v=target*e;
      el.textContent = dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-US');
      if(p<1) requestAnimationFrame(step); else el.textContent=text;
    })(t0);
  }

  /* ── grouped numbers ── */
  var gi = 0;
  $('groups').innerHTML = CONFIG.groups.map(function(g){
    return '<div class="col">' +
      '<div class="cat" data-anim style="animation:fadein .8s '+(0.05+gi*0.06)+'s both">'+g.title+'</div>' +
      g.items.map(function(k){
        gi++;
        var bar = k.bar ? '<div class="bar"><i data-w="'+
                  Math.max(0,Math.min(100, 100*k.bar.v/k.bar.max)).toFixed(1)+'"></i></div>' : '';
        return '<div class="kcard" data-anim style="animation:rise .8s '+(0.08+gi*0.045)+'s both">'+
          '<div class="lab">'+k.label+'</div>'+
          '<div class="val">'+(k.prefix?'<span class="pre">'+k.prefix+'</span>':'')+
            '<span class="num" data-v="'+k.value+'">'+k.value+'</span>'+
            (k.unit?'<small>'+k.unit+'</small>':'')+'</div>'+
          bar +
          (k.target?'<div class="tgt">'+k.target+'</div>':'')+
          (k.note?'<div class="note">'+k.note+'</div>':'')+
        '</div>';
      }).join('') +
    '</div>';
  }).join('');

  /* ── navigation ── */
  var views=Array.prototype.slice.call(document.querySelectorAll('.view'));
  var dotsEl=$('dots');
  dotsEl.innerHTML=views.map(function(_,i){ return '<span'+(i===0?' class="on"':'')+'></span>'; }).join('');
  var cur=0, timer=null, map=$('map');
  function show(i){
    i=(i+views.length)%views.length; cur=i;
    views.forEach(function(v,k){
      v.classList.toggle('on',k===i);
      if(k===i) v.querySelectorAll('[data-anim]').forEach(function(el){
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      });
    });
    map.style.opacity = (i===1) ? .48 : 1;
    Array.prototype.forEach.call(dotsEl.children,function(d,k){ d.classList.toggle('on',k===i); });
    if(i===1){
      views[1].querySelectorAll('.num').forEach(function(el,k){
        el.textContent = /^[\d.,]+$/.test(el.dataset.v) ? '0' : el.dataset.v;
        setTimeout(function(){ countUp(el, el.dataset.v, 1100); }, 220+k*70);
      });
      views[1].querySelectorAll('.bar i').forEach(function(el,k){
        el.style.width='0';
        setTimeout(function(){ el.style.width = el.dataset.w+'%'; }, 700+k*120);
      });
    }
    if(timer) clearInterval(timer);
    if(CONFIG.autoRotate) timer=setInterval(function(){ show(cur+1); }, CONFIG.autoRotateSeconds*1000);
  }
  document.addEventListener('click',function(){ show(cur+1); });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); show(cur+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); show(cur-1); }
    else if(/^[12]$/.test(e.key)) show(parseInt(e.key,10)-1);
  });
  show(0);
})();
</script>
</body>
</html>
